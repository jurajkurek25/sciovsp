<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uplatniť darčekovú kartu — SP Tréner</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--black:#08080d;--black2:#0f0f18;--black3:#15151f;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);--text:#eeeef5;--text2:#a1a1bc;--text3:#5c5c7a;--volt:#c8ff00;--purple:#7c5cff;--purple2:#b09bff;--red:#ff3f5e;--green:#36e896;--serif:'Instrument Serif',Georgia,serif;--mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:var(--text);font-family:var(--sans);line-height:1.6;min-height:100vh}
a{color:var(--purple2)}
.wrap{max-width:480px;margin:0 auto;padding:3rem 1.2rem 5rem}
.top a{font-family:var(--mono);font-size:.8rem;color:var(--text2);text-decoration:none}
h1{font-family:var(--serif);font-size:2rem;margin:1.2rem 0 .4rem}
.muted{color:var(--text3);font-size:.85rem}
.card{background:var(--black2);border:1px solid var(--border);border-radius:14px;padding:1.5rem;margin-top:1.5rem}
input{width:100%;padding:.8rem .9rem;background:var(--black3);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:1rem;text-transform:uppercase;letter-spacing:.03em}
.btn{width:100%;margin-top:1rem;padding:.85rem;background:var(--volt);color:var(--black);border:none;border-radius:9px;font-weight:700;font-family:var(--mono);font-size:.85rem;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.secondary{background:var(--black3);border:1px solid var(--border2);color:var(--text)}
.err{color:var(--red);font-size:.85rem;margin-top:.8rem;min-height:1em}
.ok{color:var(--green)}
.course-pick{display:block;width:100%;text-align:left;padding:.8rem 1rem;margin-bottom:.5rem;background:var(--black3);border:1px solid var(--border2);border-radius:8px;color:var(--text);cursor:pointer;font-size:.9rem}
.course-pick.selected{border-color:var(--volt)}
.gate button{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.4rem;background:var(--black3);border:1px solid var(--border2);color:var(--text);border-radius:9px;font-family:var(--mono);font-size:.85rem;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/">← SP Tréner</a></div>
  <h1>Uplatniť darčekovú kartu</h1>
  <div id="root"><p class="muted">Načítavam…</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://zrnqiwareacqyndwchsv.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpybnFpd2FyZWFjcXluZHdjaHN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMDA3NTAsImV4cCI6MjA4OTc3Njc1MH0.iUne23YDxp12Iwxdk9U8MfcV0NTBtrNf9OgsjQdiADk';
const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const root = document.getElementById('root');
const gSvg = '<svg width="15" height="15" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>';
let currentUser = null;
let hasLoaded = false;

async function getToken() {
  const { data: { session } } = await _supabase.auth.getSession();
  return session?.access_token || null;
}

async function init() {
  const token = await getToken();
  const { data: { session } } = await _supabase.auth.getSession();
  currentUser = session ? session.user : null;
  render(token);
  hasLoaded = true;
}

function render(token) {
  if (!currentUser) {
    root.innerHTML = `<div class="card gate">
      <p class="muted" style="margin-bottom:1rem">Prihlás sa cez Google, aby sme vedeli, komu darček priradiť.</p>
      <button id="googleBtn">${gSvg} Prihlásiť sa cez Google</button>
    </div>`;
    document.getElementById('googleBtn').onclick = () => {
      _supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.href } });
    };
    return;
  }
  root.innerHTML = `<p class="muted">Prihlásený ako ${escapeHtml(currentUser.email)}</p>
    <div class="card">
      <label class="muted" style="display:block;margin-bottom:.5rem">Kód z darčekovej karty</label>
      <input type="text" id="codeInput" placeholder="SPT-XXXX-XXXX-XXXX" maxlength="20">
      <button class="btn" id="checkBtn">Uplatniť</button>
      <div class="err" id="err"></div>
      <div id="coursePickerRoot"></div>
    </div>`;
  document.getElementById('checkBtn').onclick = () => checkCode(token);
}

function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function checkCode(token) {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const err = document.getElementById('err');
  err.textContent = '';
  if (!code) { err.textContent = 'Zadaj kód.'; return; }
  try {
    const res = await fetch('/api/gift-cards/' + encodeURIComponent(code) + '/check');
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error || 'Kód nenájdený.'; return; }
    if (data.status === 'redeemed') { err.textContent = 'Táto karta je už uplatnená.'; return; }
    if (data.kind === 'premium') {
      await redeem(token, code, null);
    } else {
      await showCoursePicker(token, code);
    }
  } catch (e) {
    err.textContent = 'Chyba servera.';
  }
}

async function showCoursePicker(token, code) {
  const picker = document.getElementById('coursePickerRoot');
  picker.innerHTML = '<p class="muted" style="margin-top:1rem">Načítavam kurzy…</p>';
  const res = await fetch('/api/courses');
  const data = await res.json();
  if (!data.courses || !data.courses.length) { picker.innerHTML = '<p class="err">Momentálne nie sú dostupné žiadne kurzy.</p>'; return; }
  picker.innerHTML = '<p class="muted" style="margin:1rem 0 .6rem">Táto karta je na 1 kurz podľa vlastného výberu — vyber si:</p>'
    + data.courses.map(c => `<button class="course-pick" data-slug="${c.slug}" data-id="${c.id}">${escapeHtml(c.title)}</button>`).join('')
    + '<button class="btn" id="confirmCourseBtn" disabled>Uplatniť kurz</button>';
  let selectedId = null;
  document.querySelectorAll('.course-pick').forEach(btn => btn.onclick = () => {
    document.querySelectorAll('.course-pick').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedId = btn.dataset.id;
    document.getElementById('confirmCourseBtn').disabled = false;
  });
  document.getElementById('confirmCourseBtn').onclick = () => redeem(token, code, selectedId);
}

async function redeem(token, code, courseId) {
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const res = await fetch('/api/gift-cards/redeem', {
      method: 'POST', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ code, courseId })
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error || 'Chyba.'; return; }
    if (data.kind === 'premium') {
      root.innerHTML = `<div class="card"><p class="ok" style="font-size:1.1rem;margin-bottom:.6rem">Hotovo! Premium aktivované.</p><p class="muted">Platí do ${new Date(data.premiumExpiresAt).toLocaleDateString('sk-SK')}.</p><a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:1rem" href="/app">Prejsť do appky</a></div>`;
    } else {
      root.innerHTML = `<div class="card"><p class="ok" style="font-size:1.1rem;margin-bottom:.6rem">Hotovo! Kurz je tvoj.</p><a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:1rem" href="/kurzy/${data.courseSlug}/watch">Spustiť kurz</a></div>`;
    }
  } catch (e) {
    err.textContent = 'Chyba servera.';
  }
}

_supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && !hasLoaded) init();
});
init();
</script>
</body>
</html>
