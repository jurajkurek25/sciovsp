<!--
  Zdieľaná šablóna pre celú emailovú sekvenciu z testu /kam-na-vysoku.
  Rovnaký branding ako webinárové emaily (main-app-patches/emails/*.html) —
  len s obsahom parametrizovaným cez placeholdery, aby jeden súbor pokryl
  všetky kroky sekvencie (výsledok / deň 2 / zľava deň 3 / po zľave) v oboch
  jazykoch bez duplikovania HTML.

  PLACEHOLDERY:
    [PREHEADER]   — skrytý náhľadový text (1 veta)
    [EYEBROW]     — malý badge nad nadpisom
    [TITLE]       — hlavný nadpis (H1)
    [BODY_HTML]   — hlavný text, môže obsahovať vlastné <p>/<div> bloky
    [CTA_URL]     — odkaz hlavného tlačidla
    [CTA_TEXT]    — text hlavného tlačidla
    [FOOTER_NOTE] — voliteľná malá poznámka pod tlačidlom (napr. platnosť zľavy) — môže byť prázdny reťazec
    [UNSUBSCRIBE] — odhlasovací odkaz
-->

  @media screen and (max-width:600px){
    .wrap{width:100%!important}
    .px{padding-left:20px!important;padding-right:20px!important}
    .h1{font-size:24px!important;line-height:1.25!important}
  }
</style>
</head>

<tr><td align="center" style="padding:32px 16px;">

    <tr><td class="px" style="padding:28px 40px 0 40px;">
      <span style="font-family:'Courier New',Courier,monospace;font-size:13px;font-weight:700;letter-spacing:.08em;color:#14100D;">← SP TRÉNER</span>
    </td></tr>

    <tr><td class="px" style="padding:22px 40px 0 40px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td style="background:#EFFCC7;border-radius:20px;padding:6px 14px;">
        <span style="font-family:'Courier New',Courier,monospace;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5C7A00;">[EYEBROW]</span>
      </td></tr></table>
    </td></tr>

    <tr><td class="px h1" style="padding:16px 40px 0 40px;font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:28px;line-height:1.25;color:#14100D;">
      [TITLE]
    </td></tr>

    <tr><td class="px" style="padding:14px 40px 0 40px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.65;color:#3A362F;">

      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td style="border-radius:8px;background:#C8FF00;">
