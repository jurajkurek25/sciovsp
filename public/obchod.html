<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obchod — SP Tréner</title>
<style>
@font-face{font-family:'DM Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/dm-mono-400-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'DM Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/dm-mono-400-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'DM Mono';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/dm-mono-500-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'DM Mono';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/dm-mono-500-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/dm-sans-var-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/dm-sans-var-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/instrument-serif-normal-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/instrument-serif-normal-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --black:#08080d;--black2:#0f0f18;--black3:#171724;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
  --text:#eeeef5;--text2:#7777a0;--text3:#3d3d5c;
  --volt:#c8ff00;--purple:#7c5cff;--purple2:#b09bff;
  --red:#ff3f5e;--green:#36e896;
  --serif:'Instrument Serif',Georgia,serif;
  --mono:'DM Mono',monospace;
  --sans:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:var(--text);font-family:var(--sans)}
nav{position:sticky;top:0;z-index:100;padding:1.1rem 2rem;display:flex;align-items:center;justify-content:space-between;background:rgba(8,8,13,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-logo{font-family:var(--mono);font-size:13px;letter-spacing:.15em;color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:.55rem}
.nav-dot{width:7px;height:7px;background:var(--volt);border-radius:50%;display:inline-block}
.nav-link{text-decoration:none;font-family:var(--mono);font-size:.78rem;letter-spacing:.05em;color:var(--text2)}
main{max-width:1100px;margin:0 auto;padding:3.5rem 2rem 5rem}
.section-label{font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--text3);margin-bottom:1rem}
h1{font-family:var(--serif);font-size:clamp(2.2rem,4.5vw,3.5rem);line-height:1.1;letter-spacing:-.02em;margin-bottom:.75rem}
h1 .volt-text{color:var(--volt);font-style:normal}
.lead{color:var(--text2);font-size:1rem;max-width:560px;line-height:1.6;margin-bottom:3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));gap:1.5rem}
.card{background:var(--black);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s}
.card:hover{border-color:var(--border2)}
.card img{width:100%;height:160px;object-fit:cover;background:var(--black2)}
.card-noimg{width:100%;height:160px;background:linear-gradient(135deg,var(--black2),rgba(124,92,255,.08));display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;color:var(--text3);text-transform:uppercase}
.card-body{padding:1.25rem;display:flex;flex-direction:column;flex:1;gap:.5rem}
.badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--volt);background:rgba(200,255,0,.08);border:1px solid rgba(200,255,0,.2);padding:3px 9px;border-radius:20px;width:fit-content}
.card-body h3{font-family:var(--serif);font-size:1.25rem;color:var(--text);line-height:1.2}
.card-body p{font-size:.85rem;color:var(--text2);line-height:1.55;flex:1}
.price{font-family:var(--mono);font-size:1.4rem;font-weight:500;color:var(--text)}
.price sup{font-size:.85rem;margin-right:2px;color:var(--text2)}
.buy{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.1rem;background:var(--volt);color:var(--black);border:none;border-radius:8px;font-weight:700;font-family:var(--mono);font-size:.82rem;letter-spacing:.03em;cursor:pointer;transition:all .2s}
.buy:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(200,255,0,.3)}
.buy:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.empty{color:var(--text2);text-align:center;padding:60px 0;font-family:var(--mono);font-size:.85rem}
footer{border-top:1px solid var(--border);padding:2.5rem 2rem;display:flex;flex-wrap:wrap;gap:1.5rem;justify-content:space-between;max-width:1100px;margin:0 auto}
.footer-logo{font-family:var(--mono);font-size:12px;letter-spacing:.15em;color:var(--text2)}

/* checkout modal (matches premium-popup pattern) */
.popup-overlay{display:none;position:fixed;inset:0;background:rgba(8,8,13,.75);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:1rem}
.popup-overlay.show{display:flex}
.popup{background:var(--black2);border:1px solid var(--border2);border-radius:20px;padding:2rem;max-width:400px;width:100%;position:relative}
.popup-close{position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--text2);font-size:1.1rem;cursor:pointer}
.popup h3{font-family:var(--serif);font-size:1.4rem;margin-bottom:1.25rem;padding-right:1.5rem}
.popup input[type=email]{width:100%;padding:.75rem;background:var(--black);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:.9rem;margin-bottom:1rem}
.popup input[type=email]::placeholder{color:var(--text3)}
.popup label.consent{display:flex;align-items:flex-start;gap:.5rem;font-size:.78rem;color:var(--text2);margin-bottom:1.5rem;line-height:1.5}
.popup label.consent a{color:var(--purple2)}
.popup .error{color:var(--red);font-size:.8rem;margin-top:-.5rem;margin-bottom:1rem}
.popup .submit{width:100%;padding:.9rem;background:var(--volt);color:var(--black);border:none;border-radius:10px;font-weight:700;font-family:var(--mono);font-size:.85rem;letter-spacing:.04em;cursor:pointer}
.popup .submit:disabled{opacity:.6;cursor:default}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo"><div class="nav-dot"></div>SP TRÉNER</a>
  <a href="/app" class="nav-link">← Späť do appky</a>
</nav>

<main>
  <div class="section-label">Obchod</div>
  <h1>Digitálne produkty <span class="volt-text">na stiahnutie</span></h1>
  <p class="lead">Jednorazová platba, žiadne predplatné. Stiahnuteľné hneď po zaplatení, aj emailom ako záloha.</p>
  <div id="grid" class="grid"><p class="empty">Načítavam produkty…</p></div>
</main>

<footer>
  <div class="footer-logo">SP TRÉNER — AI príprava na prijímačky © 2026</div>
  <div class="footer-logo"><a href="mailto:juraj@jurajkurek.com" style="color:var(--text2);text-decoration:none">Kontakt</a></div>
</footer>

<div class="popup-overlay" id="checkoutOverlay" onclick="if(event.target===this) closeCheckout()">
  <div class="popup">
    <button class="popup-close" onclick="closeCheckout()">✕</button>
    <h3 id="checkoutTitle">Kúpiť</h3>
    <form id="checkoutForm">
      <input type="email" id="checkoutEmail" placeholder="meno@gmail.com" required>
      <label class="consent">
        <input type="checkbox" id="checkoutVop" required>
        <span>Súhlasím s <a href="/legal.html#vop" target="_blank">obchodnými podmienkami</a>.</span>
      </label>
      <div class="error" id="checkoutError"></div>
      <button type="submit" class="submit" id="checkoutSubmit">Pokračovať na platbu →</button>
    </form>
  </div>
</div>

<script>
let currentProductId = null;
const overlay = document.getElementById('checkoutOverlay');

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadProducts() {
  const grid = document.getElementById('grid');
  try {
    const res = await fetch('/api/shop/products');
    const data = await res.json();
    const products = data.products || [];
    if (!products.length) {
      grid.innerHTML = '<p class="empty">Momentálne tu nič nie je — pozri sa neskôr.</p>';
      return;
    }
    grid.innerHTML = products.map(p => `
      <div class="card">
        ${p.coverImageUrl ? `<img src="${p.coverImageUrl}" alt="">` : `<div class="card-noimg">${p.fileType}</div>`}
        <div class="card-body">
          <span class="badge">${p.fileType}</span>
          <h3>${escapeHtml(p.title)}</h3>
          <p>${escapeHtml(p.description || '')}</p>
          <div class="price"><sup>€</sup>${(p.priceCents / 100).toFixed(2)}</div>
          <button class="buy" onclick="openCheckout(${p.id}, '${escapeHtml(p.title).replace(/'/g, "\\'")}')">Kúpiť →</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    grid.innerHTML = '<p class="empty">Nepodarilo sa načítať produkty.</p>';
  }
}

function openCheckout(productId, title) {
  currentProductId = productId;
  document.getElementById('checkoutTitle').textContent = title;
  document.getElementById('checkoutError').textContent = '';
  overlay.classList.add('show');
}
function closeCheckout() { overlay.classList.remove('show'); }

document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const submitBtn = document.getElementById('checkoutSubmit');
  const errorEl = document.getElementById('checkoutError');
  errorEl.textContent = '';
  submitBtn.disabled = true;
  try {
    const res = await fetch('/api/shop/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        productId: currentProductId,
        email: document.getElementById('checkoutEmail').value,
        vopAccepted: document.getElementById('checkoutVop').checked
      })
    });
    const data = await res.json();
    if (!res.ok) { errorEl.textContent = data.error || 'Chyba.'; submitBtn.disabled = false; return; }
    window.location.href = data.url;
  } catch (e) {
    errorEl.textContent = 'Chyba pripojenia, skús znova.';
    submitBtn.disabled = false;
  }
});

loadProducts();
</script>
</body>
</html>
