<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrácia obchodu — SP Tréner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>

@font-face{font-family:'DM Sans';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/dm-sans-var-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/instrument-serif-normal-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/instrument-serif-normal-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --black:#08080d;--black2:#0f0f18;--black3:#171724;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
  --text:#eeeef5;--text2:#a1a1bc;--text3:#5c5c7a;
  --volt:#c8ff00;--purple:#7c5cff;--purple2:#b09bff;--red:#ff3f5e;--green:#36e896;
  --serif:'Instrument Serif',Georgia,serif;--mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--black);color:var(--text);font-family:var(--sans);line-height:1.65;overflow-x:hidden}
a{color:inherit}
button{cursor:pointer;font-family:inherit}
nav{position:sticky;top:0;z-index:100;padding:1rem clamp(1rem,4vw,2rem);padding-top:calc(1rem + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;background:var(--black);border-bottom:1px solid var(--border)}
.nav-logo{font-family:var(--mono);font-size:13px;letter-spacing:.15em;color:var(--text);text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:.55rem}
.nav-dot{width:7px;height:7px;background:var(--volt);border-radius:50%;animation:pulse-dot 2s infinite;display:inline-block}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
.nav-link{text-decoration:none;font-family:var(--mono);font-size:.78rem;letter-spacing:.05em;color:var(--text2)}
.nav-cta{padding:.6rem 1rem;background:var(--volt);color:var(--black);border-radius:8px;font-weight:700;font-family:var(--mono);font-size:.78rem;border:none}
.page{max-width:900px;margin:0 auto;padding:clamp(2rem,6vw,3.5rem) clamp(1rem,4vw,2rem) clamp(3rem,6vw,6rem)}
.breadcrumb{font-family:var(--mono);font-size:.72rem;color:var(--text3);margin-bottom:1.5rem;display:flex;gap:.4rem;flex-wrap:wrap}
.breadcrumb a{color:var(--text3);text-decoration:none}
.breadcrumb a:hover{color:var(--purple2)}
.hero-title{font-family:var(--serif);font-size:clamp(1.8rem,5vw,2.4rem);line-height:1.1;margin-bottom:1.5rem}
.panel{background:var(--black2);border:1px solid var(--border);border-radius:16px;padding:1.75rem;margin-bottom:1.75rem}
.panel h2{font-family:var(--serif);font-size:1.4rem;margin-bottom:1.25rem}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:.65rem .5rem;border-bottom:1px solid var(--border)}
th{color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono)}
.row-actions button{background:none;border:1px solid var(--border2);color:var(--text2);border-radius:6px;padding:4px 10px;font-size:11px;font-family:var(--mono)}
.inactive{opacity:.45}
form.add{display:grid;gap:.85rem;max-width:480px}
form.add input,form.add textarea,form.add select{padding:.7rem;background:var(--black);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:.88rem}
form.add label{font-size:.75rem;color:var(--text2);font-family:var(--mono);letter-spacing:.03em;margin-bottom:-.4rem}
form.add button.submit{background:var(--volt);color:var(--black);border:none;border-radius:8px;padding:.75rem 1.1rem;font-weight:700;font-family:var(--mono);font-size:.82rem;margin-top:.25rem}
.msg{font-size:.8rem;margin-top:.5rem;font-family:var(--mono)}
.msg.error{color:var(--red)}
.msg.ok{color:var(--green)}
.locked{text-align:center;padding:5rem 0;color:var(--text2);font-family:var(--mono);font-size:.9rem}
footer{border-top:1px solid var(--border);padding:2.5rem;padding-bottom:calc(2.5rem + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.footer-logo{font-family:var(--mono);font-size:12px;letter-spacing:.15em;color:var(--text3)}
.footer-links{display:flex;gap:1.5rem;flex-wrap:wrap}
.footer-links a{font-size:.78rem;color:var(--text3);text-decoration:none;font-family:var(--mono);letter-spacing:.05em;transition:color .2s}
.footer-links a:hover{color:var(--text2)}
</style>
</head>
<body>
<nav id="mainNav">
  <a href="/obchod" class="nav-logo"><span class="nav-dot"></span>SP TRÉNER — Obchod</a>
  <button class="nav-cta" id="signinBtn" style="display:none;">Prihlásiť sa cez Google</button>
</nav>

<main class="page">
  <nav class="breadcrumb"><a href="/">SP Tréner</a><span>/</span><a href="/obchod">Obchod</a><span>/</span><span>Administrácia</span></nav>
  <h1 class="hero-title">Administrácia obchodu</h1>
  <div id="locked" class="locked">Načítavam…</div>
  <div id="app" style="display:none;">
    <div class="panel">
      <h2>Produkty</h2>
      <table>
        <thead><tr><th>Názov</th><th>Typ</th><th>Cena</th><th>Stav</th><th></th></tr></thead>
        <tbody id="productRows"></tbody>
      </table>
    </div>
    <div class="panel">
      <h2>Nový produkt</h2>
      <form class="add" id="addForm">
        <label>Názov</label>
        <input type="text" name="title" required>
        <label>Popis</label>
        <textarea name="description" rows="3"></textarea>
        <label>Cena (centy, napr. 700 = 7,00 €)</label>
        <input type="number" name="priceCents" min="50" required>
        <label>Typ súboru</label>
        <select name="fileType" required>
          <option value="pdf">PDF</option>
          <option value="epub">EPUB</option>
          <option value="mobi">MOBI</option>
          <option value="skill">.skill</option>
          <option value="zip">ZIP</option>
        </select>
        <label>Súbor produktu</label>
        <input type="file" name="file" required>
        <label>Obal (voliteľné, PNG/JPG/WEBP)</label>
        <input type="file" name="cover" accept="image/png,image/jpeg,image/webp">
        <button class="submit" type="submit">Vytvoriť produkt</button>
        <div class="msg" id="addMsg"></div>
      </form>
    </div>
  </div>
</main>

<footer>
  <div class="footer-logo">SP TRÉNER © 2026</div>
  <div class="footer-links">
    <a href="/obchod">Obchod</a>
    <a href="/app">Appka</a>
    <a href="mailto:juraj@jurajkurek.com">Kontakt</a>
  </div>
</footer>

<script>
let supabaseClient, accessToken;

async function init() {
  const cfgRes = await fetch('/api/shop/config');
  const cfg = await cfgRes.json();
  supabaseClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    accessToken = session.access_token;
    await loadProducts();
  } else {
    document.getElementById('locked').innerHTML = '<p>Táto stránka je len pre administrátorov obchodu.</p>';
    document.getElementById('signinBtn').style.display = 'inline-block';
  }
}

document.getElementById('signinBtn').addEventListener('click', async () => {
  await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
});

async function authedFetch(url, options = {}) {
  options.headers = Object.assign({}, options.headers, { Authorization: 'Bearer ' + accessToken });
  return fetch(url, options);
}

async function loadProducts() {
  const res = await authedFetch('/api/admin/shop/products');
  if (res.status === 403) {
    document.getElementById('locked').innerHTML = '<p>Prihlásený, ale tento účet nemá prístup do administrácie obchodu.</p>';
    return;
  }
  const data = await res.json();
  document.getElementById('locked').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const rows = document.getElementById('productRows');
  rows.innerHTML = (data.products || []).map(p => `
    <tr class="${p.active ? '' : 'inactive'}">
      <td>${escapeHtml(p.title)}</td>
      <td>${p.fileType}</td>
      <td>${(p.priceCents / 100).toFixed(2)} €</td>
      <td>${p.active ? 'aktívny' : 'skrytý'}</td>
      <td class="row-actions">
        <button onclick="toggleActive(${p.id}, ${!p.active})">${p.active ? 'Skryť' : 'Zobraziť'}</button>
      </td>
    </tr>
  `).join('');
}

async function toggleActive(id, newActive) {
  if (newActive) {
    const fd = new FormData();
    fd.append('active', 'true');
    await authedFetch('/api/admin/shop/products/' + id, { method: 'PUT', body: fd });
  } else {
    await authedFetch('/api/admin/shop/products/' + id, { method: 'DELETE' });
  }
  loadProducts();
}

document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('addMsg');
  msg.textContent = '';
  msg.className = 'msg';
  const fd = new FormData(e.target);
  try {
    const res = await authedFetch('/api/admin/shop/products', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) { msg.textContent = data.error || 'Chyba.'; msg.className = 'msg error'; return; }
    msg.textContent = 'Produkt vytvorený.';
    msg.className = 'msg ok';
    e.target.reset();
    loadProducts();
  } catch (err) {
    msg.textContent = 'Chyba pripojenia.';
    msg.className = 'msg error';
  }
});

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

init();
</script>
</body>
</html>
