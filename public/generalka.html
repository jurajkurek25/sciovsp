<style>
:root{
  --ink:#14100D; --ink2:#1c1610; --ink3:#241c14;
  --text:#F6F1E7; --text2:rgba(246,241,231,.66); --text3:rgba(246,241,231,.4);
  --ignite:#c8ff00; --signal:#7c5cff; --danger:#ff5a5a;
  --border:rgba(246,241,231,.14); --border2:rgba(246,241,231,.24);
  --serif:'Bricolage Grotesque',Georgia,serif; --mono:'Space Mono',monospace; --sans:'Manrope',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:var(--sans);line-height:1.6;min-height:100vh}
button{font-family:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:2.5rem 1.2rem 5rem}
h1{font-family:var(--serif);font-weight:800;font-size:2rem;margin-bottom:.5rem}
h2{font-family:var(--serif);font-weight:700;font-size:1.3rem;margin-bottom:.6rem}
p{color:var(--text2)}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.15em;color:var(--ignite);text-transform:uppercase;margin-bottom:.8rem}
.card{background:var(--ink3);border:1px solid var(--border2);border-radius:14px;padding:1.6rem;margin-top:1.5rem}
.price{font-family:var(--mono);font-size:2.5rem;font-weight:700;color:var(--ignite);margin:.8rem 0}
.price span{font-size:1rem;color:var(--text3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:1rem 1.8rem;background:var(--ignite);color:var(--ink);border:none;border-radius:10px;font-family:var(--mono);font-weight:700;font-size:.92rem;cursor:pointer;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn.secondary{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn.danger{background:var(--danger);color:#fff}
.feature-list{list-style:none;margin-top:1rem}
.feature-list li{display:flex;gap:.6rem;padding:.5rem 0;font-size:.9rem;color:var(--text2)}
.feature-list li::before{content:'✓';color:var(--ignite);font-weight:700}
.warn-box{background:rgba(255,90,90,.08);border:1px solid rgba(255,90,90,.3);border-radius:10px;padding:1rem;margin-top:1rem;font-size:.85rem;color:var(--text2)}
.warn-box b{color:var(--danger)}
.err{color:var(--danger);font-size:.85rem;margin-top:.8rem}

/* EXAM UI */
.exam-top{position:fixed;top:0;left:0;right:0;background:var(--ink2);border-bottom:1px solid var(--border2);padding:.9rem 1.2rem;display:flex;justify-content:space-between;align-items:center;z-index:100;font-family:var(--mono);font-size:.82rem}
.exam-timer{color:var(--ignite);font-weight:700;font-size:1rem}
.exam-timer.low{color:var(--danger)}
.exam-progress{color:var(--text3)}
.exam-body{max-width:720px;margin:0 auto;padding:5.5rem 1.2rem 8rem}
.q-part{font-family:var(--mono);font-size:.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem}
.q-context{background:var(--ink3);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:1rem;font-size:.88rem;color:var(--text2);white-space:pre-wrap}
.q-text{font-size:1.05rem;margin-bottom:1.2rem;white-space:pre-wrap}
.q-options{display:flex;flex-direction:column;gap:.6rem}
.q-option{display:flex;align-items:center;gap:.8rem;padding:.9rem 1.1rem;background:var(--ink3);border:1px solid var(--border2);border-radius:10px;cursor:pointer;text-align:left;font-size:.92rem}
.q-option:hover{border-color:var(--signal)}
.q-option.selected{border-color:var(--ignite);background:rgba(200,255,0,.06)}
.q-option .letter{font-family:var(--mono);font-weight:700;color:var(--text3);flex-shrink:0}
.q-option.selected .letter{color:var(--ignite)}
.exam-bottom{position:fixed;bottom:0;left:0;right:0;background:var(--ink2);border-top:1px solid var(--border2);padding:.9rem 1.2rem;display:flex;justify-content:space-between;gap:.8rem;z-index:100}
.exam-bottom button{padding:.75rem 1.3rem;border-radius:8px;font-family:var(--mono);font-size:.82rem;cursor:pointer;border:1px solid var(--border2);background:var(--ink3);color:var(--text)}
.exam-bottom button.primary{background:var(--ignite);color:var(--ink);border:none;font-weight:700}
.fs-warning-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:none;align-items:center;justify-content:center;padding:1.5rem;text-align:center}
.fs-warning-overlay.active{display:flex}
.fs-warning-overlay .box{max-width:420px}
.fs-warning-overlay h2{color:var(--danger)}

/* REPORT */
.score-hero{text-align:center;padding:2rem 0}
.score-num{font-family:var(--mono);font-size:4rem;font-weight:700;color:var(--ignite)}
.score-sub{color:var(--text3);font-family:var(--mono);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
.pct-row{display:flex;gap:1rem;margin-top:1.5rem}
.pct-box{flex:1;background:var(--ink3);border:1px solid var(--border2);border-radius:10px;padding:1rem;text-align:center}
.pct-box .val{font-family:var(--mono);font-size:1.4rem;font-weight:700;color:var(--text)}
.pct-box .label{font-family:var(--mono);font-size:.68rem;color:var(--text3);text-transform:uppercase;margin-top:.2rem}
.analysis-text{white-space:pre-wrap;font-size:.94rem;line-height:1.75;margin-top:.5rem}
.anticheat-summary{font-family:var(--mono);font-size:.78rem;color:var(--text3);margin-top:1rem}

.calib-dot{position:fixed;width:22px;height:22px;border-radius:50%;background:var(--ignite);transform:translate(-50%,-50%);z-index:9998;cursor:pointer;box-shadow:0 0 0 8px rgba(200,255,0,.15)}

/* LANDING PAGE (marketing) */
.gk-fullbleed{width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw)}
.gk-hero{padding:3rem 1.2rem 3.5rem;text-align:center}
.gk-hero-eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.18em;color:var(--ignite);text-transform:uppercase;margin-bottom:1rem}
.gk-hero h1{font-family:var(--serif);font-weight:800;font-size:clamp(2.1rem,5vw,3.4rem);line-height:1.12;margin-bottom:1.1rem}
.gk-hero h1 em{font-style:italic;color:var(--ignite)}
.gk-hero-sub{max-width:560px;margin:0 auto 2rem;color:var(--text2);font-size:1.05rem;line-height:1.6}
.gk-hero-cta{max-width:360px;margin:0 auto}
.gk-hero-note{font-family:var(--mono);font-size:.76rem;color:var(--text3);margin-top:.8rem}
.gk-stats{display:flex;justify-content:center;gap:2.4rem;margin-top:2.8rem;flex-wrap:wrap}
.gk-stat{text-align:center}
.gk-stat-val{display:block;font-family:var(--mono);font-size:1.7rem;font-weight:700;color:var(--ignite)}
.gk-stat-label{font-family:var(--mono);font-size:.66rem;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:.25rem}

.gk-section{padding:4rem 1.2rem;border-top:1px solid var(--border)}
.gk-section-inner{max-width:960px;margin:0 auto}
.gk-section-head{text-align:center;max-width:580px;margin:0 auto 2.8rem}
.gk-section-eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.15em;color:var(--signal);text-transform:uppercase;margin-bottom:.6rem}
.gk-section h2{font-family:var(--serif);font-weight:700;font-size:clamp(1.5rem,3.4vw,2.1rem);margin-bottom:.7rem}
.gk-section-sub{color:var(--text2);font-size:.95rem;line-height:1.6}

.gk-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem}
.gk-step{background:var(--ink3);border:1px solid var(--border2);border-radius:14px;padding:1.4rem 1.2rem}
.gk-step-num{font-family:var(--mono);font-size:.72rem;color:var(--ignite);margin-bottom:.7rem}
.gk-step h3{font-size:.98rem;margin-bottom:.4rem}
.gk-step p{font-size:.83rem;color:var(--text2);line-height:1.55}

.gk-features{display:grid;grid-template-columns:repeat(2,1fr);gap:1.1rem}
.gk-feature{background:var(--ink3);border:1px solid var(--border2);border-radius:14px;padding:1.5rem}
.gk-feature-icon{font-size:1.4rem;margin-bottom:.6rem}
.gk-feature h3{font-size:1rem;margin-bottom:.4rem}
.gk-feature p{font-size:.86rem;color:var(--text2);line-height:1.6}

.gk-reveal{background:var(--ink3);border:1px solid var(--border2);border-radius:16px;padding:1.8rem}

.gk-reveal li{display:flex;gap:.7rem;font-size:.9rem;color:var(--text2);line-height:1.55}
.gk-reveal li::before{content:'→';color:var(--signal);flex-shrink:0;font-family:var(--mono)}

.gk-faq-item{border-bottom:1px solid var(--border)}
.gk-faq-q{width:100%;padding:1.05rem 0;display:flex;justify-content:space-between;align-items:center;gap:1rem;background:none;border:none;color:var(--text);text-align:left;cursor:pointer;font-size:.94rem;font-weight:600;font-family:var(--sans)}
.gk-faq-arrow{font-family:var(--mono);color:var(--text3);transition:transform .25s;flex-shrink:0}
.gk-faq-item.open .gk-faq-arrow{transform:rotate(45deg);color:var(--ignite)}
.gk-faq-a{max-height:0;overflow:hidden;transition:max-height .35s ease}
.gk-faq-a-inner{padding-bottom:1.05rem;font-size:.87rem;color:var(--text2);line-height:1.65}

.gk-final{text-align:center;padding:4.5rem 1.2rem;border-top:1px solid var(--border)}
.gk-final h2{font-family:var(--serif);font-size:clamp(1.6rem,4vw,2.3rem);margin-bottom:.9rem}
.gk-final p{color:var(--text2);max-width:480px;margin:0 auto 1.8rem}
.gk-final-cta{max-width:340px;margin:0 auto}

.gk-footer{border-top:1px solid var(--border);padding:2rem 1.2rem 6rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;max-width:960px;margin:0 auto}
.gk-footer-logo{font-family:var(--mono);font-size:11px;letter-spacing:.13em;color:var(--text3)}
.gk-footer-links{display:flex;gap:1.3rem;flex-wrap:wrap}
.gk-footer-links a{font-size:.76rem;color:var(--text3);text-decoration:none;font-family:var(--mono);letter-spacing:.04em}
.gk-footer-links a:hover{color:var(--text2)}
@media(max-width:600px){.gk-footer{flex-direction:column;text-align:center;padding-bottom:6.5rem}}

.gk-sticky{position:fixed;left:0;right:0;bottom:0;z-index:998;background:rgba(20,16,13,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border2);padding:.75rem 1rem;display:none;align-items:center;gap:.75rem}
.gk-sticky-text{flex:1;font-family:var(--mono);font-size:.72rem;color:var(--text2)}
.gk-sticky-text b{color:var(--ignite);display:block;font-size:.82rem}
.gk-sticky-btn{flex-shrink:0;padding:.75rem 1.1rem;background:var(--ignite);color:var(--ink);border:none;border-radius:8px;font-family:var(--mono);font-weight:700;font-size:.8rem;cursor:pointer;white-space:nowrap}

@media(max-width:760px){
  .gk-steps{grid-template-columns:1fr 1fr}
  .gk-features{grid-template-columns:1fr}
  .gk-sticky{display:flex}
}
@media(max-width:520px){
  .gk-steps{grid-template-columns:1fr}
}
</style>
</head>

async function apiFetch(url, opts) {
  opts = opts || {};

  const params = new URLSearchParams(location.search);
  token = params.get('token');
  paidFlag = params.get('paid') === '1';

async function route() {
  if (!token && paidFlag) {

  try {

async function resolveAfterPayment(attemptsLeft) {
  if (attemptsLeft === undefined) attemptsLeft = 8;
  document.getElementById('mainWrap').innerHTML = `
    <div class="eyebrow">Platba prijatá</div>
    <h1>Pripravujeme tvoj pokus…</h1>
    <p>Chvíľku strpenia, len čo sa spracuje platba.</p>
  `;
  try {
    const data = await apiFetch('/api/generalka/my-latest-attempt');
    token = data.token;
    paidFlag = false;
    const url = new URL(location.href);
    url.searchParams.delete('paid');
    url.searchParams.set('token', token);
    history.replaceState(null, '', url);
    return route();
  } catch (e) {
    if (attemptsLeft > 0) {
      setTimeout(() => resolveAfterPayment(attemptsLeft - 1), 2000);

// ─────────────────────────── EXAM STATE ───────────────────────────
let questions = [];
let totalExpected = 66;
let questionsPollTimer = null;

// Zvyšné otázky sa po /start dopĺňajú na pozadí (server generuje po
// dávkach) — priebežne kontrolujeme, či nepribudli nové.
function startQuestionsPolling() {
  if (questionsPollTimer) return;
  questionsPollTimer = setInterval(async () => {
    if (!examActive || questions.length >= totalExpected) { stopQuestionsPolling(); return; }
    try {
      const data = await apiFetch('/api/generalka/attempt/' + encodeURIComponent(token) + '/questions');
      if (data.questions && data.questions.length > questions.length) {
        questions = data.questions;
        totalExpected = data.totalExpected || totalExpected;
        if (phase === 'analytical' && (!questions[currentIdx] || questions[currentIdx].part !== 'analytical')) {
          const idx = questions.findIndex(q => q.part === 'analytical');
          if (idx >= 0) currentIdx = idx;
        }
        renderQuestion();
      }
    } catch (e) { /* prechodná chyba pollingu, skúsime znova o chvíľu */ }
  }, 4000);
}
function stopQuestionsPolling() {
  if (questionsPollTimer) { clearInterval(questionsPollTimer); questionsPollTimer = null; }
}
let answers = {};
let currentIdx = 0;
let phase = 'verbal'; // 'verbal' | 'analytical'
let phaseEndsAt = 0;
let timerInterval = null;
let examStartedAt = 0;
let examActive = false;
const anticheatFlags = { fullscreenExits: 0, tabSwitches: 0, windowBlurs: 0 };

// ─────────────────────────── CAMERA CALIBRATION ───────────────────────────
const CALIB_POINTS = [
  [10, 10], [50, 10], [90, 10],
  [10, 50], [50, 50], [90, 50],
  [10, 90], [50, 90], [90, 90]
];
const CALIB_CLICKS_PER_POINT = 5;
let calibIdx = 0;
let calibClicks = 0;

async function startCalibration() {
  const btn = document.getElementById('startBtn');
  const errEl = document.getElementById('startErr');
  if (btn) { btn.disabled = true; }
  try {
    await document.documentElement.requestFullscreen().catch(() => {});
    await startWebcamTracking();
    if (!webcamAvailable) { startExamAfterCalibration(); return; }
    calibIdx = 0;
    calibClicks = 0;
    renderCalibrationStep();
  } catch (e) {
    if (errEl) errEl.textContent = e.message;
    if (btn) btn.disabled = false;
  }
}

function renderCalibrationStep() {
  document.getElementById('mainWrap').innerHTML = `
    <div class="eyebrow">Kalibrácia kamery</div>
    <h1>Bodka ${calibIdx + 1} / ${CALIB_POINTS.length}</h1>
    <p>Pozeraj sa priamo na bodku a klikni na ňu ${CALIB_CLICKS_PER_POINT}×. Zlepší to presnosť sledovania pozornosti počas testu.</p>
  `;
  const [x, y] = CALIB_POINTS[calibIdx];
  const dot = document.createElement('div');
  dot.className = 'calib-dot';
  dot.id = 'calibDot';
  dot.style.left = x + 'vw';
  dot.style.top = y + 'vh';
  dot.onclick = onCalibDotClick;
  document.body.appendChild(dot);
}

function onCalibDotClick() {
  calibClicks++;
  if (calibClicks < CALIB_CLICKS_PER_POINT) return;
  calibClicks = 0;
  calibIdx++;
  const dotEl = document.getElementById('calibDot');
  if (dotEl) dotEl.remove();
  if (calibIdx >= CALIB_POINTS.length) { startExamAfterCalibration(); return; }
  renderCalibrationStep();
}

async function startExamAfterCalibration() {
  document.getElementById('mainWrap').innerHTML = `
    <div class="eyebrow">Príprava</div>
    <h1>Pripravujeme prvé otázky…</h1>
    <p>Zvyšok testu AI dopĺňa na pozadí, kým budeš odpovedať. Nezatváraj ani neobnovuj stránku.</p>
  `;
  try {
    const data = await apiFetch('/api/generalka/attempt/' + encodeURIComponent(token) + '/start', { method: 'POST' });
    questions = data.questions;
    totalExpected = data.totalExpected || 66;
    if (!document.fullscreenElement) { await document.documentElement.requestFullscreen().catch(() => {}); }
    document.getElementById('mainWrap').style.display = 'none';
    document.getElementById('examTop').style.display = 'flex';
    document.getElementById('examBody').style.display = 'block';
    document.getElementById('examBottom').style.display = 'flex';
    examActive = true;
    examStartedAt = Date.now();
    currentIdx = 0;
    phase = 'verbal';
    phaseEndsAt = Date.now() + VERBAL_TIME_S * 1000;
    setupAnticheatListeners();
    startTimer();
    startQuestionsPolling();
    renderQuestion();
  } catch (e) {
    renderError(e.message + ' Skús obnoviť stránku a spustiť test znova.');
  }
}

function setupAnticheatListeners() {
  document.addEventListener('fullscreenchange', onFullscreenChange);
  document.addEventListener('visibilitychange', onVisibilityChange);
  window.addEventListener('blur', onWindowBlur);
  window.addEventListener('beforeunload', beforeUnloadHandler);
}

function beforeUnloadHandler(e) {
  if (examActive) { e.preventDefault(); e.returnValue = ''; }
}

function onFullscreenChange() {
  if (!document.fullscreenElement && examActive) {
    anticheatFlags.fullscreenExits++;
    logEvent({ type: 'fullscreen_exit' });
    document.getElementById('fsWarning').classList.add('active');
  } else if (document.fullscreenElement) {
    document.getElementById('fsWarning').classList.remove('active');
  }
}
function resumeFullscreen() {
  document.documentElement.requestFullscreen().catch(() => {});
}
function onVisibilityChange() {
  if (document.hidden && examActive) {
    anticheatFlags.tabSwitches++;
    logEvent({ type: 'tab_switch' });
  }
}
function onWindowBlur() {
  if (examActive) {
    anticheatFlags.windowBlurs++;
    logEvent({ type: 'window_blur' });
  }
}

function logEvent(event) {
  apiFetch('/api/generalka/attempt/' + encodeURIComponent(token) + '/event', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ event })
  }).catch(() => {});
}

// ─────────────────────────── WEBCAM / GAZE TRACKING ───────────────────────────
let gazeSamples = 0, gazeOffScreenCount = 0, webcamAvailable = false;
async function startWebcamTracking() {
  try {
    // TFFacemesh (MediaPipe) je jediný podporovaný tracker v tejto verzii
    // webgazer — jeho WASM/JS assety sa dotahujú z /mediapipe/face_mesh/
    // na vlastnej doméne (server.js má presmerovanie na jsdelivr CDN,
    // pozri main-app-patches/124).
    const begun = webgazer.setRegression('ridge').setGazeListener((data) => {
      if (!data) return;
      gazeSamples++;
      const onScreen = data.x >= 0 && data.x <= window.innerWidth && data.y >= 0 && data.y <= window.innerHeight;
      if (!onScreen) gazeOffScreenCount++;
    }).begin();
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('webgazer timeout')), 15000));
    await Promise.race([begun, timeout]);
    webgazer.showVideoPreview(false).showPredictionPoints(false).showFaceOverlay(false).showFaceFeedbackBox(false);
    webcamAvailable = true;
  } catch (e) {
    webcamAvailable = false;
  }
}
function stopWebcamTracking() {
  try { webgazer.end(); } catch (e) {}
}
function getWebcamSummary() {
  return {
    available: webcamAvailable,
    gazeSamples,
    gazeOffScreenCount,
    attentionPct: gazeSamples ? Math.round(100 * (gazeSamples - gazeOffScreenCount) / gazeSamples) : null
  };
}

// ─────────────────────────── TIMER ───────────────────────────
function startTimer() {
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    const remaining = Math.max(0, Math.round((phaseEndsAt - Date.now()) / 1000));
    if (remaining <= 0) {
      if (phase === 'verbal') { switchToAnalyticalPhase(); }
      else { submitExam(); }
      return;
    }
    updateTimerDisplay();
  }, 1000);
}
function updateTimerDisplay() {
  const remaining = Math.max(0, Math.round((phaseEndsAt - Date.now()) / 1000));
  const m = Math.floor(remaining / 60), s = remaining % 60;
  const el = document.getElementById('examTimer');
  if (!el) return;
  el.textContent = (phase === 'verbal' ? 'Verbálna časť · ' : 'Analytická časť · ') + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  el.classList.toggle('low', remaining < 60);
}
function switchToAnalyticalPhase() {
  phase = 'analytical';
  phaseEndsAt = Date.now() + ANALYT_TIME_S * 1000;
  const idx = questions.findIndex(q => q.part === 'analytical');
  currentIdx = idx >= 0 ? idx : questions.length;
  logEvent({ type: 'phase_switch', phase: 'analytical' });
  startQuestionsPolling();
  renderQuestion();
}

// ─────────────────────────── QUESTION RENDER ───────────────────────────
function renderQuestion() {
  const q = questions[currentIdx];
  const answered = Object.keys(answers).length;
  document.getElementById('examProgress').textContent = 'Otázka ' + (currentIdx + 1) + ' / ' + totalExpected + ' · Zodpovedané: ' + answered;
  if (!q) {
    document.getElementById('examBody').innerHTML = `<div class="q-text">AI ešte pripravuje túto časť testu, chvíľku strpenia…</div>`;
    document.getElementById('examBottom').innerHTML = `<button onclick="prevQuestion()" ${currentIdx === 0 ? 'disabled' : ''}>← Predchádzajúca</button><button class="primary" disabled>Načítavam…</button>`;
    return;
  }
  const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  document.getElementById('examBody').innerHTML = `
    <div class="q-part">${q.part === 'verbal' ? 'Verbálna časť' : 'Analytická časť'} — ${esc(q.topic || '')}</div>
    ${q.context ? `<div class="q-context">${esc(q.context)}</div>` : ''}
    <div class="q-text">${esc(q.text)}</div>
    <div class="q-options">
      ${(q.options || []).map((opt, i) => `
        <button class="q-option ${answers[currentIdx] === i ? 'selected' : ''}" onclick="selectAnswer(${i})">
          <span class="letter">${letters[i]}</span><span>${esc(opt)}</span>
        </button>`).join('')}
    </div>
  `;
  const isLastExpected = currentIdx === totalExpected - 1;
  const nextQ = questions[currentIdx + 1];
  // Ako na ostrom teste: kým nevyprší časový limit danej časti, nedá sa
  // prejsť ďalej ani keby bola ďalšia (analytická) časť už dávno
  // vygenerovaná na pozadí — fáza sa mení výhradne cez switchToAnalyticalPhase().
  const nextBlockedByPhase = nextQ && nextQ.part !== phase;
  document.getElementById('examBottom').innerHTML = `
    <button onclick="prevQuestion()" ${currentIdx === 0 ? 'disabled' : ''}>← Predchádzajúca</button>
    ${isLastExpected
      ? '<button class="primary" onclick="confirmSubmit()">Odovzdať test →</button>'
      : (nextBlockedByPhase
          ? '<button class="primary" disabled>Čakaj na koniec časového limitu tejto časti…</button>'
          : (nextQ
              ? '<button class="primary" onclick="nextQuestion()">Ďalšia →</button>'
              : '<button class="primary" disabled>Načítavam ďalšiu otázku…</button>'))}
  `;
}

function selectAnswer(optIdx) {
  const prev = answers[currentIdx];
  answers[currentIdx] = optIdx;
  logEvent({ type: prev == null ? 'answer_select' : 'answer_change', questionIdx: currentIdx, from: prev == null ? null : prev, to: optIdx });
  renderQuestion();
}
function nextQuestion() {
  if (currentIdx < questions.length - 1) { currentIdx++; renderQuestion(); }
}
function prevQuestion() {
  if (currentIdx > 0) { currentIdx--; renderQuestion(); }
}
function confirmSubmit() {
  const unanswered = questions.length - Object.keys(answers).length;
  const msg = unanswered > 0
    ? `Máš ${unanswered} nezodpovedaných úloh. Naozaj chceš odovzdať test? Toto je tvoj jediný pokus.`
    : 'Naozaj chceš odovzdať test? Toto je tvoj jediný pokus, po odovzdaní sa už nedá zmeniť.';
  if (confirm(msg)) submitExam();
}

async function submitExam() {
  examActive = false;
  clearInterval(timerInterval);
  stopQuestionsPolling();
  stopWebcamTracking();
  window.removeEventListener('beforeunload', beforeUnloadHandler);
  const durationS = Math.round((Date.now() - examStartedAt) / 1000);
  document.getElementById('examBody').innerHTML = '<p style="text-align:center;margin-top:3rem">Vyhodnocujem a generujem analýzu…</p>';
  document.getElementById('examBottom').style.display = 'none';
  document.getElementById('examTop').style.display = 'none';
  try {
    await apiFetch('/api/generalka/attempt/' + encodeURIComponent(token) + '/submit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers, durationS, webcamSummary: getWebcamSummary(), anticheatFlags })
    });
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    document.getElementById('examBody').style.display = 'none';
    document.getElementById('mainWrap').style.display = 'block';
    renderReport();
  } catch (e) {
    document.getElementById('examBody').innerHTML = `<p style="text-align:center;margin-top:3rem;color:var(--danger)">${esc(e.message)}</p>`;
  }
}

async function renderReport() {
  document.getElementById('mainWrap').innerHTML = '<p style="text-align:center;margin-top:3rem">Načítavam report…</p>';
  try {
    const data = await apiFetch('/api/generalka/attempt/' + encodeURIComponent(token) + '/report');
    document.getElementById('mainWrap').innerHTML = `
      <div class="eyebrow">Výsledok</div>
      <h1>Tvoja SP Generálka</h1>
      <div class="score-hero">
        <div class="score-num">${data.correct}/${(data.questions || []).length}</div>
        <div class="score-sub">správnych odpovedí</div>
      </div>
      <div class="pct-row">
        <div class="pct-box"><div class="val">P${data.verbalPct ?? '—'}</div><div class="label">Verbálna</div></div>
        <div class="pct-box"><div class="val">P${data.analytPct ?? '—'}</div><div class="label">Analytická</div></div>
        <div class="pct-box"><div class="val">P${data.estPct ?? '—'}</div><div class="label">Odhad celkovo</div></div>
      </div>
      <div class="card">
        <h2>AI analýza</h2>
        <div class="analysis-text">${esc(data.aiAnalysis || 'Analýza sa nepodarila vygenerovať.')}</div>
      </div>
      <div class="anticheat-summary">
        Trvanie: ${data.durationS ? Math.round(data.durationS / 60) + ' min' : '—'} ·
        Opustenie celej obrazovky: ${(data.anticheatFlags && data.anticheatFlags.fullscreenExits) || 0}× ·
        Prepnutie okna: ${(data.anticheatFlags && data.anticheatFlags.tabSwitches) || 0}× ·
        Pozornosť (kamera): ${(data.webcamSummary && data.webcamSummary.attentionPct != null) ? data.webcamSummary.attentionPct + '%' : 'nedostupné'}
      </div>
    `;
  } catch (e) {
    renderError(e.message);
  }
}

init();
</script>
</body>
</html>
