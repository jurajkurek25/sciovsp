<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Napíš nám recenziu — SP Tréner</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14100D; --ink2:#1c1610; --ink3:#241c14;
    --text:#F6F1E7; --text2:rgba(246,241,231,.66); --text3:rgba(246,241,231,.4);
    --ignite:#c8ff00; --signal:#7c5cff; --danger:#ff5a5a; --success:#36e896;
    --border:rgba(246,241,231,.14); --border2:rgba(246,241,231,.24);
    --serif:'Bricolage Grotesque',Georgia,serif; --mono:'Space Mono',monospace; --sans:'Manrope',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--text);font-family:var(--sans);padding:24px;}
  .card{width:100%;max-width:460px;background:var(--ink3);border:1px solid var(--border2);border-radius:16px;padding:2rem 1.7rem;}
  h1{font-family:var(--serif);font-weight:800;font-size:1.5rem;margin:0 0 .5rem;}
  p.sub{color:var(--text2);font-size:.9rem;margin:0 0 1.5rem;line-height:1.55;}
  .stars{display:flex;gap:6px;margin-bottom:20px;}
  .stars button{background:none;border:none;font-size:1.9rem;cursor:pointer;color:var(--text3);padding:0;line-height:1;transition:color .15s;}
  .stars button.active,.stars button:hover{color:#ffb800;}
  textarea{width:100%;min-height:110px;background:var(--ink);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:inherit;font-size:.9rem;padding:12px;resize:vertical;}
  textarea:focus,button:focus{outline:2px solid var(--signal);outline-offset:2px;}
  .submit{margin-top:1.1rem;width:100%;background:var(--ignite);border:none;border-radius:10px;padding:.95rem;color:var(--ink);font-family:var(--mono);font-size:.9rem;font-weight:700;cursor:pointer;}
  .submit:disabled{opacity:.5;cursor:default;}
  .msg{margin-top:1rem;font-size:.85rem;text-align:center;}
  .msg.err{color:var(--danger);}
  .msg.ok{color:var(--success);}
  .done{text-align:center;padding:12px 0;}
  .done .emoji{font-size:2.4rem;margin-bottom:10px;}
</style>
</head>
<body>
  <div class="card" id="card">
    <h1>Ako to dnes dopadlo?</h1>
    <p class="sub">Chceli by sme vedieť, ako ti pomohla príprava cez SP Tréner. Pár slov nám veľmi pomôže — trvá to necelú minútu.</p>
    <div class="stars" id="stars">
      <button type="button" data-v="1">★</button>
      <button type="button" data-v="2">★</button>
      <button type="button" data-v="3">★</button>
      <button type="button" data-v="4">★</button>
      <button type="button" data-v="5">★</button>
    </div>
    <textarea id="message" placeholder="Napíš nám, ako to prebehlo, čo ti pomohlo, prípadne čo by sme mali zlepšiť…"></textarea>
    <button class="submit" id="submitBtn">Odoslať recenziu</button>
    <div class="msg" id="msg"></div>
  </div>
<script>
  const token = new URLSearchParams(window.location.search).get('token') || '';
  let rating = 0;
  const starsEl = document.getElementById('stars');
  starsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-v]');
    if (!btn) return;
    rating = Number(btn.dataset.v);
    [...starsEl.children].forEach(b => b.classList.toggle('active', Number(b.dataset.v) <= rating));
  });
  document.getElementById('submitBtn').addEventListener('click', async () => {
    const msgEl = document.getElementById('msg');
    if (!token) { msgEl.textContent = 'Chýba platný odkaz z emailu.'; msgEl.className = 'msg err'; return; }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Odosielam…';
    try {
      const res = await fetch('/api/reviews/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, rating, message: document.getElementById('message').value })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Chyba pri odosielaní.');
      document.getElementById('card').innerHTML = '<div class="done"><div class="emoji">🙏</div><h1>Ďakujeme!</h1><p class="sub">Tvoja recenzia nám veľmi pomôže.</p></div>';
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Odoslať recenziu';
      msgEl.textContent = e.message; msgEl.className = 'msg err';
    }
  });
</script>
</body>
</html>
