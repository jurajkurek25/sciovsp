<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Napíš nám recenziu — SP Tréner</title>
<meta name="robots" content="noindex">
<style>
  :root{--black:#0a0a0a;--black2:#141414;--border:#262626;--text:#f5f5f5;--text2:#b3b3b3;--accent:#7c5cff;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--black);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px;}
  .card{width:100%;max-width:460px;background:var(--black2);border:1px solid var(--border);border-radius:16px;padding:32px 28px;}
  h1{font-size:1.3rem;margin:0 0 8px;}
  p.sub{color:var(--text2);font-size:.9rem;margin:0 0 24px;line-height:1.5;}
  .stars{display:flex;gap:6px;margin-bottom:20px;}
  .stars button{background:none;border:none;font-size:1.9rem;cursor:pointer;color:#3a3a3a;padding:0;line-height:1;transition:color .15s;}
  .stars button.active,.stars button:hover{color:#ffb800;}
  textarea{width:100%;min-height:110px;background:var(--black);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:.9rem;padding:12px;resize:vertical;}
  textarea:focus,button:focus{outline:2px solid var(--accent);outline-offset:2px;}
  .submit{margin-top:18px;width:100%;background:var(--accent);border:none;border-radius:10px;padding:13px;color:#fff;font-size:.95rem;font-weight:600;cursor:pointer;}
  .submit:disabled{opacity:.5;cursor:default;}
  .msg{margin-top:16px;font-size:.85rem;text-align:center;}
  .msg.err{color:#ff6b6b;}
  .msg.ok{color:#7cffb2;}
  .done{text-align:center;padding:12px 0;}
  .done .emoji{font-size:2.4rem;margin-bottom:10px;}
</style>
</head>
<body>
  <div class="card" id="card">
    <h1>Ako to dnes dopadlo?</h1>
    <p class="sub">Chceli by sme vedieť, ako ti pomohla príprava cez SP Tréner. Pár slov nám veľmi pomôže — trvá to necelú minútu.</p>
    <div class="stars" id="stars">
      <button type="button" data-v="1">★</button>
      <button type="button" data-v="2">★</button>
      <button type="button" data-v="3">★</button>
      <button type="button" data-v="4">★</button>
      <button type="button" data-v="5">★</button>
    </div>
    <textarea id="message" placeholder="Napíš nám, ako to prebehlo, čo ti pomohlo, prípadne čo by sme mali zlepšiť…"></textarea>
    <button class="submit" id="submitBtn">Odoslať recenziu</button>
    <div class="msg" id="msg"></div>
  </div>
<script>
  const token = new URLSearchParams(window.location.search).get('token') || '';
  let rating = 0;
  const starsEl = document.getElementById('stars');
  starsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-v]');
    if (!btn) return;
    rating = Number(btn.dataset.v);
    [...starsEl.children].forEach(b => b.classList.toggle('active', Number(b.dataset.v) <= rating));
  });
  document.getElementById('submitBtn').addEventListener('click', async () => {
    const msgEl = document.getElementById('msg');
    if (!token) { msgEl.textContent = 'Chýba platný odkaz z emailu.'; msgEl.className = 'msg err'; return; }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Odosielam…';
    try {
      const res = await fetch('/api/reviews/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, rating, message: document.getElementById('message').value })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Chyba pri odosielaní.');
      document.getElementById('card').innerHTML = '<div class="done"><div class="emoji">🙏</div><h1>Ďakujeme!</h1><p class="sub">Tvoja recenzia nám veľmi pomôže.</p></div>';
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Odoslať recenziu';
      msgEl.textContent = e.message; msgEl.className = 'msg err';
    }
  });
</script>
</body>
</html>
