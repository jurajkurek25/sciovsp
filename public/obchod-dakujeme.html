<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ďakujeme — SP Tréner</title>
<style>
@font-face{font-family:'DM Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/dm-mono-400-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'DM Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/dm-mono-400-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/dm-sans-var-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/dm-sans-var-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/instrument-serif-normal-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/instrument-serif-normal-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --black:#08080d;--black2:#0f0f18;--black3:#171724;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
  --text:#eeeef5;--text2:#a1a1bc;--text3:#5c5c7a;
  --volt:#c8ff00;--purple:#7c5cff;--purple2:#b09bff;--red:#ff3f5e;
  --serif:'Instrument Serif',Georgia,serif;--mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--black);color:var(--text);font-family:var(--sans);line-height:1.65;overflow-x:hidden}
a{color:inherit}
nav{position:sticky;top:0;z-index:100;padding:1rem clamp(1rem,4vw,2rem);padding-top:calc(1rem + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;background:var(--black);border-bottom:1px solid var(--border)}
.nav-logo{font-family:var(--mono);font-size:13px;letter-spacing:.15em;color:var(--text);text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:.55rem}
.nav-dot{width:7px;height:7px;background:var(--volt);border-radius:50%;animation:pulse-dot 2s infinite;display:inline-block}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
.nav-link{text-decoration:none;font-family:var(--mono);font-size:.78rem;letter-spacing:.05em;border-radius:8px;transition:all .2s;color:var(--text2);padding:.65rem .85rem;border:1px solid transparent}
.nav-link:hover{color:var(--text);border-color:var(--border2)}
.nav-link.active{color:var(--volt);border-color:rgba(200,255,0,.25)}
.nav-cta{padding:.6rem 1rem;background:var(--volt);color:var(--black);border-radius:8px;font-weight:700;font-family:var(--mono);font-size:.78rem;text-decoration:none;white-space:nowrap;border:none;cursor:pointer}
.lang-switcher{display:flex;align-items:center;gap:.35rem}
.lang-btn{padding:.45rem .7rem;border:1px solid var(--border2);background:transparent;color:var(--text2);border-radius:6px;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;cursor:pointer;transition:all .2s}
.lang-btn:hover{color:var(--text);border-color:var(--purple)}
.lang-btn.active{color:var(--volt);border-color:var(--volt)}
.nav-right{display:flex;align-items:center;gap:.75rem}
.nav-links-wrap{display:flex;align-items:center;gap:.75rem}
.nav-hamburger{display:none;width:38px;height:38px;align-items:center;justify-content:center;flex-shrink:0;background:transparent;border:1px solid var(--border2);border-radius:8px;color:var(--text);font-size:1.05rem;cursor:pointer;transition:border-color .2s}
.nav-hamburger:hover{border-color:var(--volt)}
.nav-overlay{display:none;position:fixed;inset:0;background:rgba(8,8,13,.6);backdrop-filter:blur(2px);z-index:90}
.nav-overlay.show{display:block}
.page{max-width:620px;margin:0 auto;padding:clamp(2rem,6vw,3.5rem) clamp(1rem,4vw,2rem) clamp(3rem,6vw,6rem);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh}
.breadcrumb{font-family:var(--mono);font-size:.72rem;color:var(--text3);margin-bottom:1.5rem;display:flex;gap:.4rem;flex-wrap:wrap;align-self:flex-start}
.breadcrumb a{color:var(--text3);text-decoration:none}
.breadcrumb a:hover{color:var(--purple2)}
.box{background:var(--black2);border:1px solid var(--border2);border-radius:20px;padding:3rem 2.5rem;max-width:460px;width:100%;text-align:center}
.hero-title{font-family:var(--serif);font-size:clamp(1.8rem,5vw,2.4rem);line-height:1.1;margin-bottom:.75rem}
.hero-sub{color:var(--text2);font-size:.95rem;line-height:1.6}
a.download{display:inline-flex;align-items:center;gap:.5rem;background:var(--volt);color:var(--black);text-decoration:none;font-weight:700;font-family:var(--mono);font-size:.85rem;letter-spacing:.03em;padding:.9rem 1.75rem;border-radius:10px;margin-top:1.5rem;transition:all .2s}
a.download:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(200,255,0,.3)}
.note{font-size:.78rem;color:var(--text3);margin-top:1.25rem;font-family:var(--mono)}
.error{color:var(--red)}
footer{border-top:1px solid var(--border);padding:2.5rem;padding-bottom:calc(2.5rem + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.footer-logo{font-family:var(--mono);font-size:12px;letter-spacing:.15em;color:var(--text3)}
.footer-links{display:flex;gap:1.5rem;flex-wrap:wrap}
.footer-links a{font-size:.78rem;color:var(--text3);text-decoration:none;font-family:var(--mono);letter-spacing:.05em;transition:color .2s}
.footer-links a:hover{color:var(--text2)}
@media (max-width: 768px){
  .nav-cta{padding:.5rem .9rem;font-size:.75rem}
  .nav-hamburger{display:flex}
  .nav-links-wrap{position:fixed;top:0;right:0;bottom:0;width:min(78vw,300px);background:rgba(15,15,24,.98);backdrop-filter:blur(14px);border-left:1px solid var(--border2);display:flex;flex-direction:column;align-items:stretch;gap:.4rem;padding:5.5rem 1.25rem 2rem;transform:translateX(100%);transition:transform .3s ease;z-index:150;overflow-y:auto}
  .nav-links-wrap.open{transform:translateX(0)}
  .nav-links-wrap .nav-link{padding:.85rem 1rem;border:1px solid var(--border);border-radius:10px;text-align:center;color:var(--text)}
  .nav-links-wrap .lang-switcher{margin-top:.5rem;justify-content:center}
  .nav-links-wrap .lang-btn{color:var(--text)}
}
@media (max-width: 480px){
  nav{flex-wrap:wrap;row-gap:.5rem}
  .nav-cta{padding:.4rem .65rem;font-size:.66rem}
}
</style>
</head>
<body>
<nav id="mainNav">
  <a href="/" class="nav-logo" id="navLogo"><span class="nav-dot"></span>SP TRÉNER</a>
  <div class="nav-right">
    <div class="nav-links-wrap" id="navLinksWrap">
      <a href="/blog" class="nav-link" id="navLinkBlog">Blog</a>
      <a href="/kurzy" class="nav-link" id="navLinkKurzy">Kurzy</a>
      <a href="/obchod" class="nav-link active">Obchod</a>
      <a href="/odporucame" class="nav-link" id="navLinkOdporucame">Odporúčame</a>
      <div class="lang-switcher">
        <button class="lang-btn active" id="langBtnSk" onclick="switchBlogLang('sk')">SK</button>
        <button class="lang-btn" id="langBtnCs" onclick="switchBlogLang('cs')">CZ</button>
      </div>
    </div>
    <button class="nav-cta" onclick="location.href='/?openPremium=1'">Začať zadarmo →</button>
    <button class="nav-hamburger" id="navHamburger" onclick="toggleMobileNav()" aria-label="Menu">☰</button>
  </div>
</nav>
<div class="nav-overlay" id="navOverlay" onclick="closeMobileNav()"></div>

<main class="page">
  <nav class="breadcrumb"><a href="/">SP Tréner</a><span>/</span><a href="/obchod">Obchod</a><span>/</span><span>Ďakujeme</span></nav>
  <div class="box">
    <div id="content"><p class="hero-sub">Overujem platbu…</p></div>
  </div>
</main>

<footer>
  <div class="footer-logo">SP TRÉNER © 2026</div>
  <div class="footer-links">
    <a href="/app">Aplikácia</a>
    <a href="/blog" id="footerLinkBlog">Blog</a>
    <a href="/kurzy" id="footerLinkKurzy">Kurzy</a>
    <a href="mailto:juraj@jurajkurek.com">Kontakt</a>
    <a href="/legal.html#vop">VOP</a>
    <a href="/legal.html#privacy">Súkromie</a>
    <a href="https://partner.sptrener.online">Partnerský program</a>
    <a href="https://ad.sptrener.online">Inzercia</a>
  </div>
</footer>

<script>
function toggleMobileNav(){
  var open = document.getElementById('navLinksWrap').classList.toggle('open');
  document.getElementById('navOverlay').classList.toggle('show', open);
  document.getElementById('navHamburger').textContent = open ? '✕' : '☰';
}
function closeMobileNav(){
  document.getElementById('navLinksWrap').classList.remove('open');
  document.getElementById('navOverlay').classList.remove('show');
  document.getElementById('navHamburger').textContent = '☰';
}
function switchBlogLang(l){
  var u = new URL(window.location.href);
  if (l === 'cs') { u.searchParams.set('lang', 'cs'); } else { u.searchParams.delete('lang'); }
  window.location.href = u.toString();
}
(function(){
  var isCs = new URLSearchParams(window.location.search).get('lang') === 'cs';
  document.getElementById('langBtnSk').classList.toggle('active', !isCs);
  document.getElementById('langBtnCs').classList.toggle('active', isCs);
  if (isCs) {
    var suffix = '?lang=cs';
    document.getElementById('navLogo').href = '/' + suffix;
    document.getElementById('navLinkBlog').href = '/blog' + suffix;
    document.getElementById('navLinkKurzy').href = '/kurzy' + suffix;
    document.getElementById('navLinkOdporucame').href = '/odporucame' + suffix;
    document.getElementById('footerLinkBlog').href = '/blog' + suffix;
    document.getElementById('footerLinkKurzy').href = '/kurzy' + suffix;
  }
})();

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function run() {
  const content = document.getElementById('content');
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id');
  if (!sessionId) { content.innerHTML = '<p class="hero-sub error">Chýba identifikátor platby.</p>'; return; }

  async function tryFetch(attempt) {
    try {
      const res = await fetch('/api/shop/purchase/' + encodeURIComponent(sessionId) + '/download');
      const data = await res.json();
      if (!res.ok) {
        if (attempt < 5) { setTimeout(() => tryFetch(attempt + 1), 2000); return; }
        content.innerHTML = '<p class="hero-sub error">' + (data.error || 'Platba sa ešte nespracovala.') + '</p><p class="note">Skús obnoviť stránku o chvíľu.</p>';
        return;
      }
      content.innerHTML = `
        <h1 class="hero-title">Ďakujeme!</h1>
        <p class="hero-sub">Tvoj produkt <strong style="color:var(--text)">${escapeHtml(data.title)}</strong> je pripravený.</p>
        <a class="download" href="${data.url}">⬇ Stiahnuť ${escapeHtml(data.fileType).toUpperCase()}</a>
        <p class="note">Link je platný hodinu. Poslali sme ho aj na email ako záložnú kópiu.</p>
      `;
    } catch (e) {
      content.innerHTML = '<p class="hero-sub error">Chyba pripojenia.</p>';
    }
  }
  tryFetch(0);
}
run();
</script>
</body>
</html>
