<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Inštruktor — SP Tréner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--black:#08080d;--black2:#0f0f18;--black3:#171724;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);--text:#eeeef5;--text2:#a1a1bc;--text3:#5c5c7a;--volt:#c8ff00;--purple:#7c5cff;--purple2:#b09bff;--red:#ff3f5e;--green:#36e896;--serif:'Instrument Serif',Georgia,serif;--mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:var(--text);font-family:var(--sans);line-height:1.6;min-height:100vh}
a{color:var(--purple2)}
input,textarea,select{font-family:var(--sans);background:var(--black2);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:.55rem .7rem;font-size:.87rem;width:100%}
textarea{resize:vertical;min-height:70px}
label{display:block;font-family:var(--mono);font-size:.72rem;color:var(--text3);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.04em}
.field{margin-bottom:.9rem}
button{font-family:var(--mono);cursor:pointer}
.btn{padding:.6rem 1.1rem;background:var(--volt);color:var(--black);border:none;border-radius:8px;font-weight:700;font-size:.78rem}
.btn.secondary{background:var(--black2);color:var(--text);border:1px solid var(--border2)}
.btn.danger{background:rgba(255,63,94,.15);color:var(--red);border:1px solid rgba(255,63,94,.4)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1.2rem 5rem}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
.topbar h1{font-family:var(--serif);font-size:1.6rem}
.tabs{display:flex;gap:.5rem;overflow-x:auto;margin-bottom:1.5rem;border-bottom:1px solid var(--border)}
.tab{padding:.7rem 1rem;font-family:var(--mono);font-size:.78rem;color:var(--text3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tab.active{color:var(--text);border-color:var(--volt)}
.card{background:var(--black2);border:1px solid var(--border);border-radius:14px;padding:1.2rem;margin-bottom:1rem}
.muted{color:var(--text3);font-size:.85rem}
.badge{font-family:var(--mono);font-size:.65rem;padding:.15rem .5rem;border-radius:20px;background:rgba(54,232,150,.15);color:var(--green);display:inline-block}
.badge.pending{background:rgba(200,255,0,.15);color:var(--volt)}
.badge.draft{background:rgba(255,255,255,.08);color:var(--text3)}
.course-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem 0;border-bottom:1px solid var(--border)}
.course-row:last-child{border-bottom:none}
.course-row-title{font-weight:500}
.gate{text-align:center;padding:5rem 1rem}
.lesson-item{background:var(--black);border:1px solid var(--border2);border-radius:10px;padding:.9rem;margin-bottom:.7rem}
.lesson-item h4{font-size:.95rem;margin-bottom:.3rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
@media(max-width:640px){.row2{grid-template-columns:1fr}}
.feedback{margin-top:.6rem;font-size:.85rem}
.feedback.ok{color:var(--green)}
.feedback.err{color:var(--red)}
.stat{font-family:var(--serif);font-size:2rem}
.comment-thread{margin-bottom:.9rem}
.comment{background:var(--black);border:1px solid var(--border2);border-radius:8px;padding:.7rem .8rem;font-size:.87rem;margin-bottom:.4rem}
.comment.instructor{border-color:rgba(124,92,255,.4);background:rgba(124,92,255,.06)}
.comment-head{display:flex;justify-content:space-between;gap:.6rem;margin-bottom:.35rem;font-family:var(--mono);font-size:.72rem;color:var(--text3)}
.quiz-q{background:var(--black);border:1px solid var(--border2);border-radius:8px;padding:.8rem;margin-bottom:.6rem}
.quiz-q .opts{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.5rem}

.landing{max-width:1000px;margin:0 auto;padding:0 0 4rem}
.landing-nav{display:flex;justify-content:space-between;align-items:center;padding:1.5rem 0;margin-bottom:2rem}
.landing-logo{font-family:var(--mono);font-size:.85rem;color:var(--text2)}
.landing-hero{text-align:center;padding:2rem 1rem 3rem}
.landing-hero h1{font-family:var(--serif);font-size:2.4rem;line-height:1.25;margin-bottom:1rem;max-width:760px;margin-left:auto;margin-right:auto}

.terms-box p{margin-bottom:.7rem}
.terms-box ul,.terms-box ol{padding-left:1.4rem;margin-bottom:.7rem}
.hold-btn{position:relative;width:100%;padding:1.1rem;background:var(--black2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:var(--mono);font-size:.85rem;cursor:pointer;overflow:hidden;user-select:none;-webkit-user-select:none;text-align:center}
.hold-fill{position:absolute;inset:0;background:var(--volt);width:0%;z-index:0}
.hold-btn span{position:relative;z-index:1;mix-blend-mode:difference;color:#fff}

function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function eur(cents) { return ((cents || 0) / 100).toFixed(2) + ' €'; }

function fileUploadField(id, label, kind, currentUrl) {
  return `<div class="field">

    <input type="hidden" id="${id}" value="${escapeHtml(currentUrl || '')}">
    <div class="muted" id="${id}-status" style="margin-top:.3rem">${currentUrl ? `Aktuálne nahraté: <a href="${escapeHtml(currentUrl)}" target="_blank" rel="noopener">otvoriť →</a>` : 'Zatiaľ nič nenahraté.'}</div>
  </div>`;
}

function bindFileUpload(id, kind) {
  const fileInput = document.getElementById(id + '-file');
  const hidden = document.getElementById(id);
  const status = document.getElementById(id + '-status');
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if (!file) return;
    status.textContent = 'Nahrávam… (pri videu to môže chvíľu trvať)';
    status.className = 'muted';
    try {
      const fd = new FormData();
      fd.append('file', file);
      fd.append('kind', kind);
      const res = await fetch('/api/instructor/upload', { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Nahrávanie zlyhalo.');
      hidden.value = data.url;
      status.innerHTML = `Nahraté: <a href="${data.url}" target="_blank" rel="noopener">otvoriť →</a>`;
      status.className = 'muted';
    } catch (e) {
      status.textContent = e.message;
      status.className = 'feedback err';
    }
  };
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + token, ...(opts.headers || {}) }
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Chyba servera.');
  return data;
}

async function init() {
  const { data: { session } } = await _supabase.auth.getSession();
  if (!session) { renderGate(); return; }
  token = session.access_token;
  try {
    const data = await api('/api/instructor/me');
    me = data.instructor;
    await checkLegalGates();
  } catch (e) {
    root.innerHTML = `<div class="gate"><p class="feedback err">${escapeHtml(e.message)}</p></div>`;
  }
}

_supabase.auth.onAuthStateChange((event, session) => {

// ---------- Zmluvné podmienky (gate pred prvým vstupom do portálu) ----------
async function checkLegalGates() {
  const termsData = await api('/api/instructor/terms');
  if (termsData.version && !termsData.accepted) { renderTermsGate(termsData); return; }
  const agreementData = await api('/api/instructor/custom-agreement');
  if (agreementData.agreement && !agreementData.agreement.accepted_at) { renderAgreementGate(agreementData.agreement); return; }
  renderShell();
}

function bindHoldButton(btnId, fillId, labelId, statusId, durationMs, onComplete) {
  const btn = document.getElementById(btnId);
  const fill = document.getElementById(fillId);
  const label = document.getElementById(labelId);
  const status = document.getElementById(statusId);
  const originalLabel = label.textContent;
  let startTime = null, raf = null, holding = false;

  function tick() {
    if (!holding) return;
    const elapsed = Date.now() - startTime;
    const pct = Math.min(100, (elapsed / durationMs) * 100);
    fill.style.width = pct + '%';
    if (elapsed >= durationMs) {
      holding = false;
      label.textContent = 'Ukladám potvrdenie…';
      onComplete();
      return;
    }
    raf = requestAnimationFrame(tick);
  }
  function start(e) {
    e.preventDefault();
    if (holding) return;
    holding = true;
    startTime = Date.now();
    status.textContent = '';
    raf = requestAnimationFrame(tick);
  }
  function cancel() {
    if (!holding) return;
    holding = false;
    fill.style.width = '0%';
    label.textContent = originalLabel;
    status.textContent = 'Musíš tlačidlo podržať celých 10 sekúnd bez pustenia.';
    if (raf) cancelAnimationFrame(raf);
  }
  btn.addEventListener('mousedown', start);
  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('mouseup', cancel);
  btn.addEventListener('mouseleave', cancel);
  btn.addEventListener('touchend', cancel);
  btn.addEventListener('touchcancel', cancel);
}

function renderTermsGate(termsData) {
  root.innerHTML = `<div class="gate" style="text-align:left;max-width:680px;margin:0 auto;padding-top:2rem">
    <h1 style="font-family:var(--serif);font-size:1.8rem;margin-bottom:.4rem">Zmluvné podmienky pre inštruktorov</h1>
    <p class="muted" style="margin-bottom:1rem">Verzia ${termsData.version}. Pred prvým použitím portálu si prosím pozorne prečítaj celý text nižšie — potvrdením vzniká právne záväzná dohoda medzi tebou a SP Tréner.</p>
    <div class="terms-box">${termsData.content}</div>
    <button class="hold-btn" id="termsHoldBtn"><div class="hold-fill" id="termsHoldFill"></div><span id="termsHoldLabel">Podrž 10 sekúnd — potvrdzujem, že som si podmienky prečítal(a) a rozumiem im</span></button>
    <p class="muted" id="termsHoldStatus" style="margin-top:.6rem;min-height:1.2em"></p>
  </div>`;
  bindHoldButton('termsHoldBtn', 'termsHoldFill', 'termsHoldLabel', 'termsHoldStatus', 10000, async () => {
    try { await api('/api/instructor/accept-terms', { method: 'POST' }); checkLegalGates(); }
    catch (e) { document.getElementById('termsHoldStatus').textContent = e.message; }
  });
}

function renderAgreementGate(agreement) {
  root.innerHTML = `<div class="gate" style="text-align:left;max-width:680px;margin:0 auto;padding-top:2rem">
    <h1 style="font-family:var(--serif);font-size:1.8rem;margin-bottom:.4rem">${escapeHtml(agreement.title)}</h1>
    <p class="muted" style="margin-bottom:1rem">Individuálna dohoda pripravená pre tvoj účet, navyše k štandardným podmienkam. Prečítaj si ju prosím celú — potvrdením vzniká právne záväzná dohoda.</p>
    <div class="terms-box">${agreement.content}</div>
    <button class="hold-btn" id="agHoldBtn"><div class="hold-fill" id="agHoldFill"></div><span id="agHoldLabel">Podrž 10 sekúnd na potvrdenie</span></button>
    <p class="muted" id="agHoldStatus" style="margin-top:.6rem;min-height:1.2em"></p>
  </div>`;
  bindHoldButton('agHoldBtn', 'agHoldFill', 'agHoldLabel', 'agHoldStatus', 10000, async () => {
    try { await api(`/api/instructor/custom-agreement/${agreement.id}/accept`, { method: 'POST' }); checkLegalGates(); }
    catch (e) { document.getElementById('agHoldStatus').textContent = e.message; }
  });
}

function renderShell() {
  root.innerHTML = `
    <div class="topbar">
      <h1>Vitaj, ${escapeHtml(me.name || me.email)}</h1>
      <a href="#" id="logoutLink" class="muted">Odhlásiť sa</a>
    </div>
    <div class="tabs">
      <div class="tab" data-tab="courses">Moje kurzy</div>
      <div class="tab" data-tab="earnings">Zárobky</div>
      <div class="tab" data-tab="profile">Profil</div>
    </div>
    <div id="tabRoot"></div>`;
  document.getElementById('logoutLink').onclick = async (e) => { e.preventDefault(); await _supabase.auth.signOut(); location.reload(); };
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => { activeTab = t.dataset.tab; activeCourseId = null; renderTabs(); });
  renderTabs();
}

function renderTabs() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
  if (activeTab === 'courses') renderCoursesTab();
  else if (activeTab === 'earnings') renderEarningsTab();
  else if (activeTab === 'profile') renderProfileTab();
}

// ---------- Kurzy ----------
async function renderCoursesTab() {
  const tabRoot = document.getElementById('tabRoot');
  if (activeCourseId) return renderCourseDetail(activeCourseId);
  tabRoot.innerHTML = `<p class="muted">Načítavam kurzy…</p>`;
  let data;
  try { data = await api('/api/instructor/courses'); }
  catch (e) { tabRoot.innerHTML = `<p class="feedback err">${escapeHtml(e.message)}</p>`; return; }
  coursesCache = data.courses || [];
  tabRoot.innerHTML = `
    <div class="card">
      <button class="btn" id="newCourseBtn">+ Nový kurz</button>
    </div>
    <div class="card">
      ${coursesCache.length ? coursesCache.map(courseRowHtml).join('') : '<p class="muted">Zatiaľ nemáš žiadny kurz.</p>'}
    </div>`;
  document.getElementById('newCourseBtn').onclick = createCourse;
  coursesCache.forEach(c => {
    const el = document.getElementById('course-row-' + c.id);
    if (el) el.onclick = () => { activeCourseId = c.id; renderTabs(); };
  });
}

function courseStatusBadge(c) {
  if (c.published) return '<span class="badge">zverejnený</span>';
  if (c.submitted_for_review) return '<span class="badge pending">čaká na schválenie</span>';
  return '<span class="badge draft">koncept</span>';
}

function courseRowHtml(c) {
  return `<div class="course-row" id="course-row-${c.id}" style="cursor:pointer">
    <div><div class="course-row-title">${escapeHtml(c.title)}</div><div class="muted">${eur(c.price_cents)} · ${c.lessonCount} lekcií · ${c.purchaseCount} predajov</div></div>
    ${courseStatusBadge(c)}
  </div>`;
}

async function createCourse() {
  const title = prompt('Názov kurzu:');
  if (!title || !title.trim()) return;
  try {
    await api('/api/instructor/courses', { method: 'POST', body: JSON.stringify({ title: title.trim() }) });
    renderCoursesTab();
  } catch (e) { alert(e.message); }
}

async function renderCourseDetail(id) {
  const tabRoot = document.getElementById('tabRoot');
  tabRoot.innerHTML = `<p class="muted">Načítavam…</p>`;
  let coursesData, lessonsData;
  try {
    [coursesData, lessonsData] = await Promise.all([
      api('/api/instructor/courses'), api(`/api/instructor/courses/${id}/lessons`)
    ]);
  } catch (e) { tabRoot.innerHTML = `<p class="feedback err">${escapeHtml(e.message)}</p>`; return; }

async function deleteCourse(id) {

function editLessonForm(courseId, lesson) {
  const isNew = !lesson;
  const qs = lesson?.quizQuestions || [];
  const formHtml = `<div class="card" id="lessonForm">
    <h4 style="margin-bottom:.8rem">${isNew ? 'Nová lekcia' : 'Upraviť lekciu'}</h4>
    <div class="field"><label>Názov</label><input id="lf-title" value="${escapeHtml(lesson?.title || '')}"></div>
    <div class="row2">
      ${fileUploadField('lf-video', 'Video lekcie', 'video', lesson?.video_url)}
      ${fileUploadField('lf-doc', 'PDF materiály', 'doc', lesson?.doc_url)}
    </div>
    <div class="field"><label><input type="checkbox" id="lf-upload" style="width:auto" ${lesson?.requires_upload ? 'checked' : ''}> Vyžaduje nahratie materiálu od študenta</label></div>
    <div class="field"><label>Pokyny pre nahratie (vidí ich študent)</label><textarea id="lf-upload-instr">${escapeHtml(lesson?.upload_instructions || '')}</textarea></div>
    <div class="field"><label>AI kritériá hodnotenia (skryté, študent nevidí)</label><textarea id="lf-ai-criteria">${escapeHtml(lesson?.ai_grading_criteria || '')}</textarea></div>
    <div class="field"><label>Kvíz — otázky (A/B/C/D, správna odpoveď)</label><div id="lf-quiz"></div>
      <button class="btn secondary" id="lf-add-q" type="button" style="margin-top:.4rem">+ Pridať otázku</button>
    </div>
    <button class="btn" id="lf-save">Uložiť lekciu</button>
    <button class="btn secondary" id="lf-cancel" style="margin-left:.5rem">Zrušiť</button>
    <div class="feedback" id="lf-feedback"></div>
  </div>`;
  const list = document.getElementById('lessonsList');
  const existingForm = document.getElementById('lessonForm');
  if (existingForm) existingForm.remove();
  list.insertAdjacentHTML('afterend', formHtml);
  bindFileUpload('lf-video', 'video');
  bindFileUpload('lf-doc', 'doc');

  let quizState = qs.map(q => ({ ...q }));
  function renderQuiz() {
    document.getElementById('lf-quiz').innerHTML = quizState.map((q, i) => quizQEditHtml(q, i)).join('');
    quizState.forEach((q, i) => {
      document.getElementById('lf-q-question-' + i).oninput = e => q.question = e.target.value;
      ['a', 'b', 'c', 'd'].forEach(opt => {
        document.getElementById(`lf-q-opt${opt}-${i}`).oninput = e => q['option' + opt.toUpperCase()] = e.target.value;
      });
      document.getElementById('lf-q-correct-' + i).onchange = e => q.correct = e.target.value;
      document.getElementById('lf-q-remove-' + i).onclick = () => { quizState.splice(i, 1); renderQuiz(); };
    });
  }
  renderQuiz();
  document.getElementById('lf-add-q').onclick = () => { quizState.push({ question: '', optionA: '', optionB: '', optionC: '', optionD: '', correct: 'a' }); renderQuiz(); };
  document.getElementById('lf-cancel').onclick = () => document.getElementById('lessonForm').remove();
  document.getElementById('lf-save').onclick = async () => {
    const feedback = document.getElementById('lf-feedback');
    const payload = {
      title: document.getElementById('lf-title').value,
      videoUrl: document.getElementById('lf-video').value,
      docUrl: document.getElementById('lf-doc').value,
      requiresUpload: document.getElementById('lf-upload').checked,
      uploadInstructions: document.getElementById('lf-upload-instr').value,
      aiGradingCriteria: document.getElementById('lf-ai-criteria').value,
      quizQuestions: quizState
    };
    try {
      if (isNew) await api(`/api/instructor/courses/${courseId}/lessons`, { method: 'POST', body: JSON.stringify(payload) });
      else await api(`/api/instructor/courses/${courseId}/lessons/${lesson.id}`, { method: 'PUT', body: JSON.stringify(payload) });
      renderCourseDetail(courseId);
    } catch (e) { feedback.textContent = e.message; feedback.className = 'feedback err'; }
  };
}

function quizQEditHtml(q, i) {
  return `<div class="quiz-q">
    <input id="lf-q-question-${i}" placeholder="Text otázky" value="${escapeHtml(q.question || '')}">
    <div class="opts">
      <input id="lf-q-opta-${i}" placeholder="A" value="${escapeHtml(q.optionA || '')}">
      <input id="lf-q-optb-${i}" placeholder="B" value="${escapeHtml(q.optionB || '')}">
      <input id="lf-q-optc-${i}" placeholder="C" value="${escapeHtml(q.optionC || '')}">
      <input id="lf-q-optd-${i}" placeholder="D" value="${escapeHtml(q.optionD || '')}">
    </div>
    <div style="margin-top:.5rem;display:flex;align-items:center;gap:.6rem">
      <label style="margin:0">Správna:</label>
      <select id="lf-q-correct-${i}" style="width:auto">
        ${['a', 'b', 'c', 'd'].map(o => `<option value="${o}" ${q.correct === o ? 'selected' : ''}>${o.toUpperCase()}</option>`).join('')}
      </select>
      <button class="btn danger" id="lf-q-remove-${i}" type="button" style="margin-left:auto">Odstrániť</button>
    </div>
  </div>`;
}

// ---------- Otázky ----------
async function loadCourseComments(courseId, lessons) {
  const mount = document.getElementById('commentsRoot');
  try {
    const data = await api(`/api/instructor/courses/${courseId}/comments`);
    const comments = data.comments || [];
    const byParent = {};
    comments.forEach(c => { if (c.parentId) (byParent[c.parentId] = byParent[c.parentId] || []).push(c); });
    function one(c) {
      return `<div class="comment${c.isInstructor ? ' instructor' : ''}">
        <div class="comment-head"><span>${c.isInstructor ? 'Ty (lektor)' : escapeHtml(c.email)} · ${escapeHtml(c.lessonTitle)}</span><span>${new Date(c.createdAt).toLocaleDateString('sk-SK')}</span></div>
        <div>${escapeHtml(c.body)}</div>
        ${!c.isInstructor ? `<div style="margin-top:.5rem"><input placeholder="Odpovedať…" id="reply-${c.id}" style="margin-bottom:.4rem"><button class="btn secondary" id="reply-btn-${c.id}">Odpovedať</button></div>` : ''}
      </div>`;
    }
    const roots = comments.filter(c => !c.parentId);
    mount.innerHTML = roots.length
      ? roots.map(c => `<div class="comment-thread">${one(c)}${(byParent[c.id] || []).map(r => `<div style="margin-left:1.2rem">${one(r)}</div>`).join('')}</div>`).join('')
      : '<p class="muted">Zatiaľ žiadne otázky.</p>';
    roots.forEach(c => {
      const btn = document.getElementById('reply-btn-' + c.id);
      if (btn) btn.onclick = async () => {
        const input = document.getElementById('reply-' + c.id);
        if (!input.value.trim()) return;
        try {
          await api(`/api/instructor/courses/${courseId}/comments`, { method: 'POST', body: JSON.stringify({ lessonId: c.lessonId, parentId: c.id, body: input.value.trim() }) });
          loadCourseComments(courseId, lessons);
        } catch (e) { alert(e.message); }
      };
    });
  } catch (e) { mount.innerHTML = `<p class="feedback err">${escapeHtml(e.message)}</p>`; }
}

    const feedback = document.getElementById('bannerFeedback');
    try {
      const data = await api('/api/instructor/me', {
        method: 'PUT',
        body: JSON.stringify({
          bannerImageUrl: document.getElementById('p-banner').value,
          bannerLinkUrl: document.getElementById('p-banner-link').value.trim()
        })
      });
      me = data.instructor;
      feedback.textContent = 'Uložené.'; feedback.className = 'feedback ok';
    } catch (e) { feedback.textContent = e.message; feedback.className = 'feedback err'; }
  };
  loadBannerStats();
}

async function loadBannerStats() {
  const mount = document.getElementById('bannerStatsRoot');
  try {
    const data = await api('/api/instructor/banner-stats');
    mount.innerHTML = `
      <div class="stat">${data.totalClicks}</div>
      <p class="muted" style="margin-bottom:.6rem">preklikov na banner celkovo</p>
      ${data.byCourse.length ? data.byCourse.map(c => `
        <div class="course-row"><div>${escapeHtml(c.courseTitle)}</div><div>${c.count}</div></div>
      `).join('') : ''}`;
  } catch (e) { mount.innerHTML = `<p class="feedback err">${escapeHtml(e.message)}</p>`; }
}

init();
</script>
</body>
</html>
