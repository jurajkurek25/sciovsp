*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:var(--text);font-family:var(--sans);line-height:1.6;min-height:100vh}
a{color:var(--purple2)}

textarea{resize:vertical;min-height:70px}
label{display:block;font-family:var(--mono);font-size:.72rem;color:var(--text3);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.04em}
.field{margin-bottom:.9rem}
button{font-family:var(--mono);cursor:pointer}
.btn{padding:.6rem 1.1rem;background:var(--volt);color:var(--black);border:none;border-radius:8px;font-weight:700;font-size:.78rem}
.btn.secondary{background:var(--black2);color:var(--text);border:1px solid var(--border2)}
.btn.danger{background:rgba(255,63,94,.15);color:var(--red);border:1px solid rgba(255,63,94,.4)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.lang-btn{background:transparent;color:var(--text2);border:1px solid var(--border2);padding:.4rem .7rem;font-size:.72rem}
.btn.lang-btn.active{color:var(--volt);border-color:var(--volt)}
.wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1.2rem 5rem}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
.topbar h1{font-family:var(--serif);font-size:1.6rem}
.topbar-right{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.tabs{display:flex;gap:.5rem;overflow-x:auto;margin-bottom:1.5rem;border-bottom:1px solid var(--border)}
.tab{padding:.7rem 1rem;font-family:var(--mono);font-size:.78rem;color:var(--text3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tab.active{color:var(--text);border-color:var(--volt)}
.card{background:var(--black2);border:1px solid var(--border);border-radius:14px;padding:1.2rem;margin-bottom:1rem}
.muted{color:var(--text3);font-size:.85rem}
.badge{font-family:var(--mono);font-size:.65rem;padding:.15rem .5rem;border-radius:20px;background:rgba(54,232,150,.15);color:var(--green);display:inline-block}

.badge.draft{background:rgba(255,255,255,.08);color:var(--text3)}
.course-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem 0;border-bottom:1px solid var(--border)}
.course-row:last-child{border-bottom:none}
.course-row-title{font-weight:500}
.gate{text-align:center;padding:5rem 1rem}
.lesson-item{background:var(--black);border:1px solid var(--border2);border-radius:10px;padding:.9rem;margin-bottom:.7rem}
.lesson-item h4{font-size:.95rem;margin-bottom:.3rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}

.feedback{margin-top:.6rem;font-size:.85rem}
.feedback.ok{color:var(--green)}
.feedback.err{color:var(--red)}
.stat{font-family:var(--serif);font-size:2rem}
.comment-thread{margin-bottom:.9rem}
.comment{background:var(--black);border:1px solid var(--border2);border-radius:8px;padding:.7rem .8rem;font-size:.87rem;margin-bottom:.4rem}
.comment.instructor{border-color:rgba(124,92,255,.4);background:rgba(124,92,255,.06)}
.comment-head{display:flex;justify-content:space-between;gap:.6rem;margin-bottom:.35rem;font-family:var(--mono);font-size:.72rem;color:var(--text3)}
.quiz-q{background:var(--black);border:1px solid var(--border2);border-radius:8px;padding:.8rem;margin-bottom:.6rem}

.landing-who-item{display:flex;gap:.9rem;align-items:flex-start}

.landing-who-item h4{font-family:var(--serif);font-size:1.05rem;margin-bottom:.3rem;font-weight:400}
.landing-who-item p{color:var(--text2);font-size:.87rem;line-height:1.55}
.landing-checklist{background:var(--black2);border:1px solid var(--border);border-radius:14px;padding:1.8rem;margin-bottom:3.5rem}
.landing-checklist-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.9rem;max-width:820px;margin:0 auto}
.landing-check-item{display:flex;gap:.7rem;align-items:center;color:var(--text2);font-size:.9rem}
.landing-check-item .mark{color:var(--volt);flex-shrink:0}
.landing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.1rem;margin-bottom:3.5rem}
.landing-card{background:var(--black2);border:1px solid var(--border);border-radius:14px;padding:1.4rem}
.landing-icon{font-size:1.6rem;margin-bottom:.6rem}
.landing-card h3{font-family:var(--serif);font-size:1.15rem;margin-bottom:.5rem}
.landing-card p{color:var(--text2);font-size:.9rem;line-height:1.6}
.landing-example{background:linear-gradient(155deg,rgba(200,255,0,.08),rgba(124,92,255,.06));border:1px solid var(--border2);border-radius:16px;padding:2rem;margin-bottom:3.5rem}
.landing-example-title{font-family:var(--serif);font-size:1.5rem;text-align:center;margin-bottom:.3rem}
.landing-example-intro{text-align:center;color:var(--text2);font-size:.92rem;margin-bottom:1.6rem}
.landing-example-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;max-width:640px;margin:0 auto}

.landing-example-box{background:var(--black);border:1px solid var(--border2);border-radius:12px;padding:1.3rem;text-align:center}
.landing-example-amount{font-family:var(--serif);font-size:2.2rem;color:var(--volt);margin:.4rem 0}
.landing-example-label{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text3)}
.landing-example-body{color:var(--text2);font-size:.85rem;margin-top:.5rem;line-height:1.5}
.landing-example-note{text-align:center;color:var(--text3);font-size:.8rem;margin-top:1.3rem}
.landing-how{background:var(--black2);border:1px solid var(--border);border-radius:14px;padding:1.8rem;margin-bottom:3.5rem}
.landing-how ol{padding-left:1.3rem;color:var(--text2);line-height:2.1;max-width:560px;margin:0 auto}
.landing-faq{margin-bottom:3rem}
.landing-faq-item{border-bottom:1px solid var(--border);padding:1.1rem 0}
.landing-faq-item h4{font-family:var(--serif);font-size:1.05rem;margin-bottom:.4rem;font-weight:400}
.landing-faq-item p{color:var(--text2);font-size:.9rem;line-height:1.6}
.landing-footer{text-align:center;padding-top:1rem}

.terms-box{max-height:340px;overflow-y:auto;background:var(--black);border:1px solid var(--border2);border-radius:10px;padding:1.2rem;margin:1rem 0;font-size:.87rem;line-height:1.7}
.terms-box h1,.terms-box h2,.terms-box h3{font-family:var(--serif);margin:1rem 0 .5rem}
.terms-box p{margin-bottom:.7rem}
.terms-box ul,.terms-box ol{padding-left:1.4rem;margin-bottom:.7rem}
.hold-btn{position:relative;width:100%;padding:1.1rem;background:var(--black2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:var(--mono);font-size:.85rem;cursor:pointer;overflow:hidden;user-select:none;-webkit-user-select:none;text-align:center}
.hold-btn.hold-btn-locked{opacity:.4;cursor:not-allowed}
.hold-fill{position:absolute;inset:0;background:var(--volt);width:0%;z-index:0}
.hold-btn span{position:relative;z-index:1;mix-blend-mode:difference;color:#fff}
</style>

function detectInitialLang() {
  const saved = localStorage.getItem('instructorLang');
  if (saved === 'sk' || saved === 'cs') return saved;
  return (navigator.language || '').toLowerCase().startsWith('cs') ? 'cs' : 'sk';
}
let lang = detectInitialLang();
function t(key, vars) {
  let s = (T[lang] && T[lang][key]) || T.sk[key] || key;
  if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}
function setLang(l) {
  lang = l;
  localStorage.setItem('instructorLang', l);
  document.title = t('pageTitle');
  document.documentElement.lang = l;
  rerenderCurrentView();
}
function langSwitcherHtml(idPrefix) {
  return `<span style="display:inline-flex;gap:.35rem">
    <button class="btn lang-btn ${lang === 'sk' ? 'active' : ''}" id="${idPrefix}-sk">SK</button>
    <button class="btn lang-btn ${lang === 'cs' ? 'active' : ''}" id="${idPrefix}-cs">CS</button>
  </span>`;
}
function bindLangSwitcher(idPrefix) {
  const skBtn = document.getElementById(idPrefix + '-sk');
  const csBtn = document.getElementById(idPrefix + '-cs');
  if (skBtn) skBtn.onclick = () => setLang('sk');
  if (csBtn) csBtn.onclick = () => setLang('cs');
}
function rerenderCurrentView() {
  if (root.querySelector('#termsPublicView')) { renderTermsPublic(); return; }
  if (!token) { renderGate(); return; }
  if (!me) return;
  if (root.querySelector('#termsBox')) { checkLegalGates(); return; }
  if (root.querySelector('#agBox')) { checkLegalGates(); return; }
  renderShell();
}

// ==================== helpers ====================
function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function eur(cents) { return ((cents || 0) / 100).toFixed(2) + ' €'; }
function referralLinkFor(course) { return `${location.origin.replace('instructor.', '')}/kurzy/${course.slug}?ref=${me.referralCode}`; }

function fileUploadField(id, label, kind, currentUrl) {
  return `<div class="field">
    <label>${label}</label>
    <input type="file" id="${id}-file" accept="${kind === 'video' ? 'video/mp4,video/webm,video/quicktime' : kind === 'image' ? 'image/png,image/jpeg,image/webp' : 'application/pdf'}">
    <input type="hidden" id="${id}" value="${escapeHtml(currentUrl || '')}">
    <div class="muted" id="${id}-status" style="margin-top:.3rem">${currentUrl ? `${t('fileCurrentlyUploaded')} <a href="${escapeHtml(currentUrl)}" target="_blank" rel="noopener">${t('fileOpen')}</a>` : t('fileNotUploaded')}</div>
  </div>`;
}

function bindFileUpload(id, kind) {
  const fileInput = document.getElementById(id + '-file');
  const hidden = document.getElementById(id);
  const status = document.getElementById(id + '-status');
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if (!file) return;
    status.textContent = t('fileUploading');
    status.className = 'muted';
    try {
      const fd = new FormData();
      fd.append('file', file);
      fd.append('kind', kind);
      const res = await fetch('/api/instructor/upload', { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || t('fileUploadFailed'));
      hidden.value = data.url;
      status.innerHTML = `${t('fileUploaded')} <a href="${data.url}" target="_blank" rel="noopener">${t('fileOpen')}</a>`;
      status.className = 'muted';
    } catch (e) {
      status.textContent = e.message;
      status.className = 'feedback err';
    }
  };
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + token, ...(opts.headers || {}) }
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || t('serverError'));
  return data;
}

  document.title = t('pageTitle');
  const { data: { session } } = await _supabase.auth.getSession();
  if (!session) { renderGate(); return; }
  token = session.access_token;
  try {
    const data = await api('/api/instructor/me');
    me = data.instructor;

function bindHoldButton(btnId, fillId, labelId, statusId, durationMs, onComplete) {
  const btn = document.getElementById(btnId);
  const fill = document.getElementById(fillId);
  const label = document.getElementById(labelId);
  const status = document.getElementById(statusId);
  const originalLabel = label.textContent;
  let startTime = null, raf = null, holding = false;

  function tick() {
    if (!holding) return;
    const elapsed = Date.now() - startTime;
    const pct = Math.min(100, (elapsed / durationMs) * 100);
    fill.style.width = pct + '%';
    if (elapsed >= durationMs) {
      holding = false;
      label.textContent = t('savingConfirmation');
      onComplete();
      return;
    }
    raf = requestAnimationFrame(tick);
  }
  function start(e) {
    e.preventDefault();
    if (holding || btn.disabled) return;
    holding = true;
    startTime = Date.now();
    status.textContent = '';
    raf = requestAnimationFrame(tick);
  }
  function cancel() {
    if (!holding) return;
    holding = false;
    fill.style.width = '0%';
    label.textContent = originalLabel;
    status.textContent = t('releasedEarly');
    if (raf) cancelAnimationFrame(raf);
  }
  btn.addEventListener('mousedown', start);
  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('mouseup', cancel);
  btn.addEventListener('mouseleave', cancel);
  btn.addEventListener('touchend', cancel);
  btn.addEventListener('touchcancel', cancel);
}

// Tlačidlo na potvrdenie ostáva zamknuté, kým používateľ nedoscroluje
// text podmienok úplne dole — má to zabrániť potvrdeniu bez prečítania.
function bindScrollGate(boxId, btnId, hintId) {
  const box = document.getElementById(boxId);
  const btn = document.getElementById(btnId);
  const hint = document.getElementById(hintId);
  function atBottom() { return box.scrollTop + box.clientHeight >= box.scrollHeight - 4; }
  function check() {
    if (atBottom()) {
      btn.disabled = false;
      btn.classList.remove('hold-btn-locked');
      hint.textContent = '';
    }
  }
  btn.disabled = true;
  btn.classList.add('hold-btn-locked');
  hint.textContent = t('scrollHint');
  box.addEventListener('scroll', check);
  check(); // krátky text sa nemusí dať scrollovať vôbec — vtedy odomkni rovno
}

      <button class="btn secondary" id="lf-add-q" type="button" style="margin-top:.4rem">${t('addQuestionBtn')}</button>
    </div>
    <button class="btn" id="lf-save">${t('saveLessonBtn')}</button>
    <button class="btn secondary" id="lf-cancel" style="margin-left:.5rem">${t('cancelBtn')}</button>
    <div class="feedback" id="lf-feedback"></div>
  </div>`;
  const list = document.getElementById('lessonsList');
  const existingForm = document.getElementById('lessonForm');
  if (existingForm) existingForm.remove();
  list.insertAdjacentHTML('afterend', formHtml);
  bindFileUpload('lf-video', 'video');
  bindFileUpload('lf-doc', 'doc');

  let quizState = qs.map(q => ({ ...q }));
  function renderQuiz() {
    document.getElementById('lf-quiz').innerHTML = quizState.map((q, i) => quizQEditHtml(q, i)).join('');
    quizState.forEach((q, i) => {
      document.getElementById('lf-q-question-' + i).oninput = e => q.question = e.target.value;
      ['a', 'b', 'c', 'd'].forEach(opt => {
        document.getElementById(`lf-q-opt${opt}-${i}`).oninput = e => q['option' + opt.toUpperCase()] = e.target.value;
      });
      document.getElementById('lf-q-correct-' + i).onchange = e => q.correct = e.target.value;
      document.getElementById('lf-q-remove-' + i).onclick = () => { quizState.splice(i, 1); renderQuiz(); };
    });
  }
  renderQuiz();
  document.getElementById('lf-add-q').onclick = () => { quizState.push({ question: '', optionA: '', optionB: '', optionC: '', optionD: '', correct: 'a' }); renderQuiz(); };
  document.getElementById('lf-cancel').onclick = () => document.getElementById('lessonForm').remove();
  document.getElementById('lf-save').onclick = async () => {
    const feedback = document.getElementById('lf-feedback');
    const payload = {
      title: document.getElementById('lf-title').value,
      videoUrl: document.getElementById('lf-video').value,
      docUrl: document.getElementById('lf-doc').value,
      requiresUpload: document.getElementById('lf-upload').checked,
      uploadInstructions: document.getElementById('lf-upload-instr').value,
      aiGradingCriteria: document.getElementById('lf-ai-criteria').value,
      quizQuestions: quizState
    };
    try {
      if (isNew) await api(`/api/instructor/courses/${courseId}/lessons`, { method: 'POST', body: JSON.stringify(payload) });
      else await api(`/api/instructor/courses/${courseId}/lessons/${lesson.id}`, { method: 'PUT', body: JSON.stringify(payload) });
      renderCourseDetail(courseId);
    } catch (e) { feedback.textContent = e.message; feedback.className = 'feedback err'; }
  };
}

function quizQEditHtml(q, i) {
  return `<div class="quiz-q">
    <input id="lf-q-question-${i}" placeholder="${t('questionPlaceholder')}" value="${escapeHtml(q.question || '')}">
    <div class="opts">
      <input id="lf-q-opta-${i}" placeholder="A" value="${escapeHtml(q.optionA || '')}">
      <input id="lf-q-optb-${i}" placeholder="B" value="${escapeHtml(q.optionB || '')}">
      <input id="lf-q-optc-${i}" placeholder="C" value="${escapeHtml(q.optionC || '')}">
      <input id="lf-q-optd-${i}" placeholder="D" value="${escapeHtml(q.optionD || '')}">
    </div>
    <div style="margin-top:.5rem;display:flex;align-items:center;gap:.6rem">
      <label style="margin:0">${t('correctLabel')}</label>
      <select id="lf-q-correct-${i}" style="width:auto">
        ${['a', 'b', 'c', 'd'].map(o => `<option value="${o}" ${q.correct === o ? 'selected' : ''}>${o.toUpperCase()}</option>`).join('')}
      </select>
      <button class="btn danger" id="lf-q-remove-${i}" type="button" style="margin-left:auto">${t('removeBtn')}</button>
    </div>
  </div>`;
}

async function deleteLesson(courseId, lessonId) {
  if (!confirm(t('confirmDeleteLesson'))) return;
  try {
    await api(`/api/instructor/courses/${courseId}/lessons/${lessonId}`, { method: 'DELETE' });
    renderCourseDetail(courseId);
  } catch (e) { alert(e.message); }
}

// ---------- Zľavové kódy ----------
async function loadCourseDiscountCodes(courseId) {
  const mount = document.getElementById('discountCodesRoot');
  try {
    const data = await api(`/api/instructor/courses/${courseId}/discount-codes`);
    renderDiscountCodesList(mount, courseId, data.codes || []);
  } catch (e) { mount.innerHTML = `<p class="feedback err">${escapeHtml(e.message)}</p>`; }
}

function renderDiscountCodesList(mount, courseId, codes) {
  mount.innerHTML = `
    <div id="dcList">${codes.length ? codes.map(c => `
      <div class="course-row">
        <div>
          <span style="font-family:var(--mono)">${escapeHtml(c.code)}</span> — ${c.percent_off}%
          <span class="muted">${c.used_count}${c.max_uses ? ' / ' + c.max_uses : ''} ${t('discountUses')}${c.expires_at ? t('discountValidUntil', { date: new Date(c.expires_at).toLocaleDateString(lang === 'cs' ? 'cs-CZ' : 'sk-SK') }) : ''}</span>
          ${c.active ? `<span class="badge" style="margin-left:.4rem">${t('discountActive')}</span>` : `<span class="badge locked" style="margin-left:.4rem">${t('discountInactive')}</span>`}
        </div>
        <div style="display:flex;gap:.4rem">
          <button class="btn secondary dc-toggle-btn" data-id="${c.id}" data-active="${c.active}">${c.active ? t('discountTurnOff') : t('discountTurnOn')}</button>
          <button class="btn danger dc-delete-btn" data-id="${c.id}">${t('deleteBtn')}</button>
        </div>
      </div>`).join('') : `<p class="muted">${t('discountNone')}</p>`}</div>
    <div class="field" style="margin-top:.9rem"><label>${t('discountNewLabel')}</label>
      <div class="row2">
        <input id="dc-code" placeholder="${t('discountCodePlaceholder')}">
        <input id="dc-percent" type="number" min="1" max="100" placeholder="${t('discountPercentPlaceholder')}">
      </div>
    </div>
    <div class="field">
      <div class="row2">
        <input id="dc-maxuses" type="number" min="1" placeholder="${t('discountMaxUsesPlaceholder')}">
        <input id="dc-expires" type="date">
      </div>
    </div>
    <button class="btn secondary" id="dc-create-btn">${t('discountCreateBtn')}</button>
    <div class="feedback" id="dcFeedback"></div>`;

  mount.querySelectorAll('.dc-toggle-btn').forEach(btn => btn.onclick = async () => {
    try {
      await api(`/api/instructor/courses/${courseId}/discount-codes/${btn.dataset.id}`, { method: 'PUT', body: JSON.stringify({ active: btn.dataset.active !== 'true' }) });
      loadCourseDiscountCodes(courseId);
    } catch (e) { alert(e.message); }
  });
  mount.querySelectorAll('.dc-delete-btn').forEach(btn => btn.onclick = async () => {
    if (!confirm(t('discountConfirmDelete'))) return;
    try {
      await api(`/api/instructor/courses/${courseId}/discount-codes/${btn.dataset.id}`, { method: 'DELETE' });
      loadCourseDiscountCodes(courseId);
    } catch (e) { alert(e.message); }
  });
  document.getElementById('dc-create-btn').onclick = async () => {
    const feedback = document.getElementById('dcFeedback');
    try {
      await api(`/api/instructor/courses/${courseId}/discount-codes`, {
        method: 'POST',
        body: JSON.stringify({
          code: document.getElementById('dc-code').value,
          percentOff: document.getElementById('dc-percent').value,
          maxUses: document.getElementById('dc-maxuses').value || null,
          expiresAt: document.getElementById('dc-expires').value || null
        })
      });
      loadCourseDiscountCodes(courseId);
    } catch (e) { feedback.textContent = e.message; feedback.className = 'feedback err'; }
  };
}

// ---------- Otázky ----------
async function loadCourseComments(courseId, lessons) {
  const mount = document.getElementById('commentsRoot');
  try {
    const data = await api(`/api/instructor/courses/${courseId}/comments`);
    const comments = data.comments || [];
    const byParent = {};
    comments.forEach(c => { if (c.parentId) (byParent[c.parentId] = byParent[c.parentId] || []).push(c); });
    function one(c) {
      return `<div class="comment${c.isInstructor ? ' instructor' : ''}">
        <div class="comment-head"><span>${c.isInstructor ? t('commentYou') : escapeHtml(c.email)} · ${escapeHtml(c.lessonTitle)}</span><span>${new Date(c.createdAt).toLocaleDateString(lang === 'cs' ? 'cs-CZ' : 'sk-SK')}</span></div>
        <div>${escapeHtml(c.body)}</div>
        ${!c.isInstructor ? `<div style="margin-top:.5rem"><input placeholder="${t('replyPlaceholder')}" id="reply-${c.id}" style="margin-bottom:.4rem"><button class="btn secondary" id="reply-btn-${c.id}">${t('replyBtn')}</button></div>` : ''}
      </div>`;
    }
    const roots = comments.filter(c => !c.parentId);
    mount.innerHTML = roots.length
      ? roots.map(c => `<div class="comment-thread">${one(c)}${(byParent[c.id] || []).map(r => `<div style="margin-left:1.2rem">${one(r)}</div>`).join('')}</div>`).join('')
      : `<p class="muted">${t('commentsNone')}</p>`;
    roots.forEach(c => {
      const btn = document.getElementById('reply-btn-' + c.id);
      if (btn) btn.onclick = async () => {
        const input = document.getElementById('reply-' + c.id);
        if (!input.value.trim()) return;
        try {
          await api(`/api/instructor/courses/${courseId}/comments`, { method: 'POST', body: JSON.stringify({ lessonId: c.lessonId, parentId: c.id, body: input.value.trim() }) });
          loadCourseComments(courseId, lessons);
        } catch (e) { alert(e.message); }
      };
    });
  } catch (e) { mount.innerHTML = `<p class="feedback err">${escapeHtml(e.message)}</p>`; }
}

// ---------- Nahraté materiály ----------
async function loadCourseSubmissions(courseId) {
  const mount = document.getElementById('submissionsRoot');
  try {
    const data = await api(`/api/instructor/courses/${courseId}/submissions`);
    const subs = data.submissions || [];
    mount.innerHTML = subs.length ? subs.map(s => `
      <div class="comment">
        <div class="comment-head"><span>${escapeHtml(s.email)} · ${escapeHtml(s.lessonTitle)}</span><span>${new Date(s.createdAt).toLocaleDateString(lang === 'cs' ? 'cs-CZ' : 'sk-SK')}</span></div>
        <div>${t('submissionVerdict')} <strong style="color:${s.aiVerdict === 'pass' ? 'var(--green)' : 'var(--red)'}">${s.aiVerdict === 'pass' ? t('submissionPass') : t('submissionFail')}</strong></div>
        <div class="muted" style="margin-top:.3rem">${escapeHtml(s.aiFeedback || '')}</div>
        ${s.fileUrl ? `<a href="${s.fileUrl}" target="_blank" rel="noopener" style="display:inline-block;margin-top:.5rem">${t('submissionOpenFile')}</a>` : ''}
      </div>`).join('') : `<p class="muted">${t('submissionsNone')}</p>`;
  } catch (e) { mount.innerHTML = `<p class="feedback err">${escapeHtml(e.message)}</p>`; }
}

// ---------- Zárobky ----------
async function renderEarningsTab() {
  const tabRoot = document.getElementById('tabRoot');
  tabRoot.innerHTML = `<p class="muted">${t('loading')}</p>`;
  let data;
  try { data = await api('/api/instructor/earnings'); }
  catch (e) { tabRoot.innerHTML = `<p class="feedback err">${escapeHtml(e.message)}</p>`; return; }
  tabRoot.innerHTML = `
    <div class="card">
      <div class="stat">${eur(data.unpaidCents)}</div>
      <p class="muted">${t('earningsUnpaidNote', { n: data.unpaidSaleCount })}</p>
      <p class="muted" style="font-size:.78rem">${t('earningsFeeNote')}</p>
      <div class="field" style="margin-top:1rem;max-width:320px"><label>${t('ibanLabel')}</label><input id="payoutIban" value="${escapeHtml(me.iban || '')}"></div>
      <button class="btn" id="requestPayoutBtn" ${data.unpaidCents ? '' : 'disabled'}>${t('requestPayoutBtn')}</button>
      <div class="feedback" id="payoutFeedback"></div>
    </div>
    <div class="card">
      <h3 style="font-family:var(--serif);font-size:1.2rem;margin-bottom:.8rem">${t('recentSalesTitle')}</h3>
      ${data.recentSales.length ? data.recentSales.map(s => `
        <div class="course-row"><div>${escapeHtml(s.courseTitle)} ${s.viaReferral ? `<span class="badge" style="margin-left:.4rem">${t('referralBadge')}</span>` : ''}</div><div>${eur(s.shareCents)}</div></div>
      `).join('') : `<p class="muted">${t('noSales')}</p>`}
    </div>
    <div class="card">
      <h3 style="font-family:var(--serif);font-size:1.2rem;margin-bottom:.8rem">${t('payoutHistoryTitle')}</h3>
      ${data.payouts.length ? data.payouts.map(p => `
        <div class="course-row"><div>${new Date(p.requestedAt).toLocaleDateString(lang === 'cs' ? 'cs-CZ' : 'sk-SK')}</div><div>${eur(p.amountCents)} · ${p.status === 'completed' ? `<span class="badge">${t('payoutPaid')}</span>` : `<span class="badge pending">${t('payoutPending')}</span>`}</div></div>
      `).join('') : `<p class="muted">${t('noPayouts')}</p>`}
    </div>`;
  document.getElementById('requestPayoutBtn').onclick = async () => {
    const feedback = document.getElementById('payoutFeedback');
    try {
      await api('/api/instructor/payouts', { method: 'POST', body: JSON.stringify({ iban: document.getElementById('payoutIban').value }) });
      feedback.textContent = t('requestSent'); feedback.className = 'feedback ok';
      renderEarningsTab();
    } catch (e) { feedback.textContent = e.message; feedback.className = 'feedback err'; }
  };
}

// ---------- Profil ----------
function renderProfileTab() {
  const tabRoot = document.getElementById('tabRoot');
  tabRoot.innerHTML = `
    <div class="card">
      <div class="field"><label>${t('profileNameLabel')}</label><input id="p-name" value="${escapeHtml(me.name || '')}"></div>
      <div class="field"><label>${t('profileBioLabel')}</label><textarea id="p-bio">${escapeHtml(me.bio || '')}</textarea></div>
      ${fileUploadField('p-photo', t('profilePhotoLabel'), 'image', me.photoUrl)}
      <div class="field"><label>${t('profileIbanLabel')}</label><input id="p-iban" value="${escapeHtml(me.iban || '')}"></div>
      <button class="btn" id="saveProfileBtn">${t('saveBtn')}</button>
      <div class="feedback" id="profileFeedback"></div>
    </div>
    <div class="card">
      <p class="muted">${t('referralNote')}</p>
    </div>
    <div class="card">
      <h3 style="font-family:var(--serif);font-size:1.2rem;margin-bottom:.4rem">${t('bannerTitle')}</h3>
      <p class="muted" style="margin-bottom:.8rem">${t('bannerIntro')}</p>
      ${fileUploadField('p-banner', t('bannerImageLabel'), 'image', me.bannerImageUrl)}
      <div class="field"><label>${t('bannerLinkLabel')}</label><input id="p-banner-link" placeholder="https://…" value="${escapeHtml(me.bannerLinkUrl || '')}"></div>
      <button class="btn" id="saveBannerBtn">${t('saveBannerBtn')}</button>
      <div class="feedback" id="bannerFeedback"></div>
      <div id="bannerStatsRoot" style="margin-top:1rem"><p class="muted">${t('bannerStatsLoading')}</p></div>
    </div>`;
  bindFileUpload('p-photo', 'image');
  bindFileUpload('p-banner', 'image');
  document.getElementById('saveProfileBtn').onclick = async () => {

          bannerImageUrl: document.getElementById('p-banner').value,
          bannerLinkUrl: document.getElementById('p-banner-link').value.trim()
        })
      });
      me = data.instructor;
      feedback.textContent = t('saved'); feedback.className = 'feedback ok';
    } catch (e) { feedback.textContent = e.message; feedback.className = 'feedback err'; }
  };
  loadBannerStats();

async function loadBannerStats() {
  const mount = document.getElementById('bannerStatsRoot');
  try {
    const data = await api('/api/instructor/banner-stats');
    mount.innerHTML = `
      <div class="stat">${data.totalClicks}</div>
      <p class="muted" style="margin-bottom:.6rem">${t('totalClicksNote')}</p>
      ${data.byCourse.length ? data.byCourse.map(c => `
        <div class="course-row"><div>${escapeHtml(c.courseTitle)}</div><div>${c.count}</div></div>
      `).join('') : ''}`;
  } catch (e) { mount.innerHTML = `<p class="feedback err">${escapeHtml(e.message)}</p>`; }
}

init();
