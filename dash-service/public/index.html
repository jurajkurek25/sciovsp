<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dash — SP Tréner</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
<style>
:root{--black:#08080d;--black2:#0f0f18;--black3:#15151f;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);--text:#eeeef5;--text2:#a1a1bc;--text3:#5c5c7a;--volt:#c8ff00;--purple:#7c5cff;--purple2:#b09bff;--red:#ff3f5e;--green:#36e896;--yellow:#ffc94d;--serif:'Instrument Serif',Georgia,serif;--mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--black);color:var(--text);font-family:var(--sans);line-height:1.5;min-height:100vh}
button,input,textarea,select{font-family:inherit;color:inherit}
a{color:var(--purple2)}
.hidden{display:none !important}

/* login */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.login-card{width:100%;max-width:360px;background:var(--black2);border:1px solid var(--border);border-radius:14px;padding:2rem}
.login-card h1{font-family:var(--serif);font-size:1.8rem;margin:0 0 .3rem}
.login-card p{color:var(--text3);font-size:.85rem;margin:0 0 1.5rem}
.login-card input{width:100%;padding:.8rem 1rem;background:var(--black3);border:1px solid var(--border2);border-radius:9px;font-size:.9rem;margin-bottom:.9rem}
.login-card button{width:100%;padding:.85rem;background:var(--volt);color:var(--black);border:none;border-radius:9px;font-weight:700;font-family:var(--mono);cursor:pointer}
#loginError{color:var(--red);font-size:.8rem;margin-top:.7rem;min-height:1em}

/* shell */
#app{display:flex;min-height:100vh}
nav.side{width:220px;flex-shrink:0;background:var(--black2);border-right:1px solid var(--border);padding:1.2rem .8rem;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:var(--mono);font-size:.8rem;letter-spacing:.1em;color:var(--text);padding:.4rem .6rem 1.2rem}
.brand span{color:var(--volt)}
.navlink{display:block;padding:.6rem .7rem;border-radius:8px;color:var(--text2);text-decoration:none;font-size:.83rem;cursor:pointer;margin-bottom:.15rem;border:1px solid transparent}
.navlink.active{background:var(--black3);color:var(--text);border-color:var(--border2)}
.navlink:hover{color:var(--text)}
main{flex:1;min-width:0;padding:1.8rem 2rem 4rem}
.pagehead{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:.6rem;margin-bottom:1.4rem}
.pagehead h2{font-family:var(--serif);font-size:1.7rem;margin:0}
.btn{padding:.6rem 1rem;background:var(--volt);color:var(--black);border:none;border-radius:8px;font-weight:700;font-family:var(--mono);font-size:.78rem;cursor:pointer}
.btn.secondary{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn.danger{background:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.9rem;margin-bottom:1.6rem}
.card{background:var(--black2);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.2rem}
.card h3{font-family:var(--mono);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin:0 0 .5rem}
.card .num{font-family:var(--serif);font-size:1.9rem}
.card .err{color:var(--red);font-size:.75rem}
.card.wide{grid-column:1 / -1}

table{width:100%;border-collapse:collapse;font-size:.83rem}
th{text-align:left;font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);padding:.5rem .6rem;border-bottom:1px solid var(--border2)}
td{padding:.6rem;border-bottom:1px solid var(--border)}
.table-wrap{overflow-x:auto;background:var(--black2);border:1px solid var(--border);border-radius:12px}

.pill{display:inline-block;padding:.2rem .55rem;border-radius:20px;font-family:var(--mono);font-size:.68rem}
.pill.open{background:rgba(255,63,94,.15);color:var(--red)}
.pill.pending{background:rgba(255,201,77,.15);color:var(--yellow)}
.pill.resolved,.pill.completed{background:rgba(54,232,150,.15);color:var(--green)}
.pill.in_progress{background:rgba(124,92,255,.15);color:var(--purple2)}

.formrow{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
.formrow input,.formrow textarea,.formrow select{padding:.6rem .8rem;background:var(--black3);border:1px solid var(--border2);border-radius:8px;font-size:.83rem}
textarea{width:100%;min-height:110px;padding:.7rem;background:var(--black3);border:1px solid var(--border2);border-radius:8px;font-size:.85rem;resize:vertical}

.lesson-item,.card-item,.bug-item{background:var(--black2);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:.7rem}
.lesson-item h4,.card-item h4{margin:0 0 .4rem;font-family:var(--serif);font-size:1.15rem}
.muted{color:var(--text3);font-size:.78rem}

.chat{display:flex;flex-direction:column;height:70vh;background:var(--black2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;padding:1rem 1.2rem;display:flex;flex-direction:column;gap:.8rem}
.msg{max-width:80%;padding:.7rem .9rem;border-radius:10px;font-size:.87rem;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--purple);color:#fff}
.msg.assistant{align-self:flex-start;background:var(--black3);border:1px solid var(--border2)}
.chat-input{display:flex;gap:.6rem;padding:.8rem;border-top:1px solid var(--border)}
.chat-input textarea{flex:1;min-height:44px}

.qr-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50}
.qr-modal{background:var(--black2);border:1px solid var(--border2);border-radius:14px;padding:1.6rem;max-width:340px;width:90%;text-align:center}
.qr-modal img{width:220px;height:220px;background:#fff;border-radius:8px;margin:.8rem auto}

.rich-editor{background:var(--black3);border:1px solid var(--border2);border-radius:8px;margin-top:.6rem;overflow:hidden}
.rich-editor .ql-toolbar{background:var(--black2);border:none;border-bottom:1px solid var(--border2)}
.rich-editor .ql-toolbar .ql-stroke{stroke:var(--text2)}
.rich-editor .ql-toolbar .ql-fill{fill:var(--text2)}
.rich-editor .ql-toolbar .ql-picker-label{color:var(--text2)}
.rich-editor .ql-toolbar button:hover .ql-stroke,.rich-editor .ql-toolbar button.ql-active .ql-stroke{stroke:var(--volt)}
.rich-editor .ql-toolbar button:hover .ql-fill,.rich-editor .ql-toolbar button.ql-active .ql-fill{fill:var(--volt)}
.rich-editor .ql-toolbar button.ql-active .ql-picker-label{color:var(--volt)}
.rich-editor .ql-container{border:none;font-family:var(--sans);font-size:.9rem;color:var(--text);min-height:240px}
.rich-editor .ql-editor{min-height:240px}
.rich-editor .ql-editor.ql-blank::before{color:var(--text3);font-style:normal}
.rich-editor .ql-editor h2{font-family:var(--serif);font-size:1.4rem}
.rich-editor .ql-editor h3{font-weight:700}
.rich-editor .ql-editor a{color:var(--purple2)}
.rich-editor .ql-picker-options{background:var(--black2);border:1px solid var(--border2)}
.rich-editor .ql-picker-item{color:var(--text2)}

/* mobile */
.mobile-topbar{display:none}
.nav-overlay{display:none}
#navToggle{display:none}
@media (max-width:860px){
  .mobile-topbar{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1rem;background:var(--black2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
  .mobile-topbar .brand{padding:0}
  #navToggle{display:inline-flex;align-items:center;justify-content:center;width:2.4rem;height:2.4rem;background:transparent;border:1px solid var(--border2);color:var(--text);border-radius:8px;font-size:1.2rem;cursor:pointer;line-height:1}
  #app{flex-direction:column}
  nav.side{position:fixed;top:0;left:0;height:100vh;width:78vw;max-width:280px;transform:translateX(-100%);transition:transform .25s ease;z-index:50;box-shadow:2px 0 24px rgba(0,0,0,.5)}
  nav.side.open{transform:translateX(0)}
  .nav-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:45;display:block}
  .nav-overlay.hidden{display:none}
  main{padding:1.2rem 1rem 3rem;width:100%}
}
@media (max-width:480px){
  main{padding:1rem .8rem 3rem}
  .pagehead{gap:.4rem}
  .pagehead h2{font-size:1.4rem}
  .grid{grid-template-columns:1fr}
  table{font-size:.76rem}
  th,td{padding:.45rem .4rem}
  .chat{height:78vh}
  .msg{max-width:92%}
  .qr-modal{padding:1.2rem}
  .qr-modal img{width:170px;height:170px}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h1>dash<span style="color:var(--volt)">.</span></h1>
    <p>sptrener.online — prístup iba pre Juraja</p>
    <input type="password" id="loginPassword" placeholder="Heslo" autocomplete="current-password">
    <button id="loginBtn">Prihlásiť sa</button>
    <div id="loginError"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="mobile-topbar">
    <div class="brand">dash<span>.</span>sptrener</div>
    <button id="navToggle" type="button" aria-label="Menu">☰</button>
  </div>
  <div class="nav-overlay hidden" id="navOverlay"></div>
  <nav class="side" id="sideNav">
    <div class="brand">dash<span>.</span>sptrener</div>
    <a class="navlink" data-page="overview">Prehľad</a>
    <a class="navlink" data-page="trends">Trendy</a>
    <a class="navlink" data-page="academy">Akadémia</a>
    <a class="navlink" data-page="courses">Kurzy</a>
    <a class="navlink" data-page="blog">Blog</a>
    <a class="navlink" data-page="houseads">Vlastné reklamy</a>
    <a class="navlink" data-page="giftcards">Darčekové karty</a>
    <a class="navlink" data-page="payouts">Výplaty (PAY by square)</a>
    <a class="navlink" data-page="bugs">Nahlásené chyby</a>
    <a class="navlink" data-page="advisor">AI poradca</a>
    <a class="navlink" data-page="aiops">AI ops log</a>
    <a class="navlink" data-page="" id="logoutLink" style="margin-top:1.5rem;color:var(--red)">Odhlásiť sa</a>
  </nav>
  <main id="main"></main>
</div>

<div id="qrModalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script>
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'content-type': 'application/json', ...(opts.headers || {}) },
    credentials: 'same-origin'
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// ─────────────────────────── AUTH ───────────────────────────
$('#loginBtn').addEventListener('click', doLogin);
$('#loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const password = $('#loginPassword').value;
  $('#loginError').textContent = '';
  try {
    await api('/api/dash/login', { method: 'POST', body: JSON.stringify({ password }) });
    showApp();
  } catch (err) {
    $('#loginError').textContent = err.message;
  }
}

$('#logoutLink').addEventListener('click', async (e) => {
  e.preventDefault();
  await api('/api/dash/logout', { method: 'POST' }).catch(() => {});
  location.reload();
});

async function checkAuth() {
  try {
    await api('/api/dash/me');
    showApp();
  } catch {
    $('#loginScreen').classList.remove('hidden');
    $('#app').classList.add('hidden');
  }
}

function showApp() {
  $('#loginScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  navigate('overview');
}

// ─────────────────────────── ROUTER ───────────────────────────
const PAGES = { overview: renderOverview, trends: renderTrends, academy: renderAcademy, courses: renderCourses, blog: renderBlog, houseads: renderHouseAds, giftcards: renderGiftcards, payouts: renderPayouts, bugs: renderBugs, advisor: renderAdvisor, aiops: renderAiops };

$$('.navlink[data-page]').forEach(a => a.addEventListener('click', () => { navigate(a.dataset.page); closeMobileNav(); }));

// ─────────────────────────── MOBILE NAV DRAWER ───────────────────────────
function openMobileNav() {
  $('#sideNav').classList.add('open');
  $('#navOverlay').classList.remove('hidden');
}
function closeMobileNav() {
  $('#sideNav').classList.remove('open');
  $('#navOverlay').classList.add('hidden');
}
$('#navToggle').addEventListener('click', openMobileNav);
$('#navOverlay').addEventListener('click', closeMobileNav);

let currentOverviewSnapshot = null;

function navigate(page) {
  $$('.navlink[data-page]').forEach(a => a.classList.toggle('active', a.dataset.page === page));
  const main = $('#main');
  main.innerHTML = '<p class="muted">Načítavam…</p>';
  PAGES[page]().catch(err => { main.innerHTML = `<p style="color:var(--red)">${err.message}</p>`; });
}

// ─────────────────────────── COVER IMAGE FIELD (zdielane kurzy + blog) ───────────────────────────
function coverFieldHtml(urlInputClass, currentUrl) {
  const safeUrl = (currentUrl || '').replace(/"/g, '&quot;');
  return `<div class="cover-field" style="margin-bottom:.6rem">
    <input class="${urlInputClass}" placeholder="URL cover obrázku (alebo nahraj súbor / vygeneruj automaticky nižšie)" value="${safeUrl}" style="width:100%;padding:.6rem .8rem;background:var(--black3);border:1px solid var(--border2);border-radius:8px;margin-bottom:.5rem">
    <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
      <input type="file" class="cover-file" accept="image/png,image/jpeg,image/webp" style="font-size:.78rem;max-width:220px">
      <button class="btn secondary cover-upload-btn" type="button">Nahrať súbor</button>
      <button class="btn secondary cover-auto-btn" type="button">Vygenerovať automaticky</button>
      <span class="muted cover-status"></span>
    </div>
    <div class="cover-preview" style="margin-top:.6rem">${currentUrl ? `<img src="${safeUrl}" style="max-width:220px;border-radius:8px;display:block">` : '<span class="muted">Bez URL sa vygeneruje automaticky (branded cover podľa názvu).</span>'}</div>
  </div>`;
}

function bindCoverField(root, urlInputClass, kind) {
  const urlInput = $('.' + urlInputClass, root);
  const fileInput = $('.cover-file', root);
  const uploadBtn = $('.cover-upload-btn', root);
  const autoBtn = $('.cover-auto-btn', root);
  const status = $('.cover-status', root);
  const preview = $('.cover-preview', root);

  function updatePreview() {
    const url = urlInput.value.trim();
    preview.innerHTML = url
      ? `<img src="${url.replace(/"/g,'&quot;')}" style="max-width:220px;border-radius:8px;display:block">`
      : '<span class="muted">Bez URL sa vygeneruje automaticky (branded cover podľa názvu).</span>';
  }
  urlInput.addEventListener('input', updatePreview);

  uploadBtn.onclick = async () => {
    const file = fileInput.files[0];
    if (!file) { alert('Najprv vyber súbor.'); return; }
    status.textContent = 'Nahrávam…';
    try {
      const fd = new FormData();
      fd.append('kind', kind);
      fd.append('file', file);
      const res = await fetch('/api/dash/upload-cover', { method: 'POST', body: fd, credentials: 'same-origin' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Nahrávanie zlyhalo.');
      urlInput.value = data.url;
      updatePreview();
      status.textContent = 'Nahraté ✓';
    } catch (err) {
      status.textContent = '';
      alert(err.message);
    }
  };

  autoBtn.onclick = () => {
    urlInput.value = '';
    updatePreview();
    status.textContent = 'Vygeneruje sa automaticky';
  };
}

// ─────────────────────────── RICH TEXT EDITOR (zdielane kurzy + blog) ───────────────────────────
function richEditorHtml(containerClass, placeholder) {
  return `<div class="rich-editor"><div class="${containerClass}" data-placeholder="${(placeholder||'').replace(/"/g,'&quot;')}"></div></div>`;
}

function initRichEditor(root, containerClass, initialHtml) {
  const container = $('.' + containerClass, root);
  if (typeof Quill === 'undefined') return fallbackTextEditor(container, initialHtml);
  try {
    const quill = new Quill(container, {
      theme: 'snow',
      placeholder: container.dataset.placeholder || '',
      modules: {
        toolbar: [
          [{ header: [2, 3, false] }],
          ['bold', 'italic'],
          [{ list: 'ordered' }, { list: 'bullet' }],
          ['blockquote', 'link'],
          ['clean']
        ]
      }
    });
    if (initialHtml) quill.root.innerHTML = initialHtml;
    return quill;
  } catch (err) {
    return fallbackTextEditor(container, initialHtml);
  }
}

// Ak sa Quill nepodarí načítať z CDN (výpadok siete, adblock...), formulár
// nesmie zostať nepoužiteľný — spadne na obyčajný textarea s rovnakým
// rozhraním (.getText()/.root.innerHTML), aby zvyšok kódu fungoval bez zmeny.
function fallbackTextEditor(container, initialHtml) {
  container.innerHTML = '';
  const ta = document.createElement('textarea');
  ta.style.cssText = 'width:100%;min-height:240px;padding:.8rem;background:transparent;border:none;color:var(--text);font-family:var(--sans);font-size:.9rem;resize:vertical;display:block';
  ta.value = initialHtml || '';
  ta.placeholder = 'Rich editor sa nepodarilo načítať — vlož HTML priamo (h2, p, ul/li, strong...).';
  container.appendChild(ta);
  return { getText: () => ta.value, root: { get innerHTML() { return ta.value; } } };
}

function metricCard(m, formatFn) {
  if (!m.ok) return `<div class="card"><h3>${m.label}</h3><div class="err">chyba: ${m.error}</div></div>`;
  return `<div class="card"><h3>${m.label}</h3><div class="num">${formatFn ? formatFn(m.value) : m.value}</div></div>`;
}

// ─────────────────────────── OVERVIEW ───────────────────────────
async function renderOverview() {
  const data = await api('/api/dash/overview');
  currentOverviewSnapshot = data;
  const m = [...Object.values(data.main), ...Object.values(data.partner), ...Object.values(data.ads)];
  const html = `
    <div class="pagehead"><h2>Prehľad</h2><button class="btn secondary" onclick="navigate('overview')">Obnoviť</button></div>
    <div class="grid">
      ${m.map(x => metricCard(x, v => Array.isArray(v) ? v.map(r => `${r.plan||r.n}: ${r.n||''}`).join(', ') || '0' : (typeof v === 'number' ? v : ''))).join('')}
      ${metricCard(data.bugReports, v => v)}
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Čas</th><th>Akcia</th><th>Systém</th><th>Dôvod</th><th>Výsledok</th></tr></thead>
        <tbody>${(data.aiActions.ok ? data.aiActions.value : []).map(a => `<tr>
          <td class="muted">${new Date(a.created_at).toLocaleString('sk-SK')}</td>
          <td>${a.action_type}</td><td>${a.target_system||''}</td>
          <td class="muted">${(a.reasoning||'').slice(0,120)}</td>
          <td><span class="pill ${a.result==='success'?'resolved':'open'}">${a.result}</span></td>
        </tr>`).join('') || '<tr><td class="muted" colspan="5">Zatiaľ žiadne AI akcie.</td></tr>'}</tbody>
      </table>
    </div>`;
  $('#main').innerHTML = html;
}

// ─────────────────────────── TRENDS ───────────────────────────
async function renderTrends() {
  const data = await api('/api/dash/trends');
  const barList = (rows, keyLabel, keyVal) => (rows||[]).map(r => `<div style="display:flex;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid var(--border)"><span>${r[keyLabel]}</span><span class="muted">${r[keyVal]}</span></div>`).join('') || '<p class="muted">Žiadne dáta.</p>';
  $('#main').innerHTML = `
    <div class="pagehead"><h2>Trendy</h2></div>
    <div class="grid">
      <div class="card wide"><h3>Registrácie / 30 dní</h3>${data.signupsByDay.ok ? barList(data.signupsByDay.value,'day','n') : `<div class="err">${data.signupsByDay.error}</div>`}</div>
      <div class="card"><h3>Aktívne predplatné</h3>${data.subsByPlan.ok ? barList(data.subsByPlan.value,'plan','n') : `<div class="err">${data.subsByPlan.error}</div>`}</div>
      <div class="card"><h3>Blog podľa tagu</h3>${data.blogByTag.ok ? barList(data.blogByTag.value,'tag','n') : `<div class="err">${data.blogByTag.error}</div>`}</div>
      <div class="card wide"><h3>Blog podľa mesiaca</h3>${data.blogByMonth.ok ? barList(data.blogByMonth.value,'month','n') : `<div class="err">${data.blogByMonth.error}</div>`}</div>
    </div>`;
}

// ─────────────────────────── ACADEMY ───────────────────────────
async function renderAcademy() {
  const { lessons } = await api('/api/dash/academy');
  $('#main').innerHTML = `
    <div class="pagehead"><h2>Partner Akadémia</h2><button class="btn" id="newLessonBtn">+ Nová lekcia</button></div>
    <div id="lessonsList">${lessons.map(l => lessonEditorHtml(l)).join('')}</div>`;
  $('#newLessonBtn').addEventListener('click', () => {
    $('#lessonsList').insertAdjacentHTML('afterbegin', lessonEditorHtml({ id: '', lesson_key: '', title: '', content: '', minutes: 3, sort_order: 0 }, true));
    bindLessonForms();
  });
  bindLessonForms();
}

function lessonEditorHtml(l, isNew) {
  return `<div class="lesson-item" data-id="${l.id}" data-new="${!!isNew}">
    <div class="formrow">
      <input class="f-key" placeholder="lesson_key" value="${l.lesson_key||''}" ${isNew?'':'disabled'} style="width:220px">
      <input class="f-minutes" type="number" placeholder="minúty" value="${l.minutes||3}" style="width:100px">

async function renderCourseLessons(courseId, panel) {

  const { cards } = await api('/api/dash/giftcards');
  $('#main').innerHTML = `
    <div class="pagehead"><h2>Darčekové karty</h2></div>
    <div class="card" style="margin-bottom:1.4rem">
      <h3>Pridať novú kartu</h3>
      <div class="formrow">
        <input id="ncBrand" placeholder="Značka (napr. Alza)">
        <input id="ncValue" type="number" placeholder="Hodnota €">
        <input id="ncDesc" placeholder="Popis" style="flex:1">
        <button class="btn" id="addCardBtn">Pridať kartu</button>
      </div>
    </div>
    <div id="cardsList">${cards.map(c => `
      <div class="card-item">
        <h4>${c.brand} — ${c.value_eur}€ ${c.is_active ? '' : '<span class="muted">(neaktívna)</span>'}</h4>
        <p class="muted">${c.description||''} · skladom kódov: ${c.stock_count}</p>
        <div class="formrow">
          <textarea class="codes-input" placeholder="Kódy, jeden na riadok (voliteľne code|redeemUrl)" style="min-height:70px"></textarea>
        </div>
        <button class="btn add-codes-btn" data-id="${c.id}">Pridať kódy</button>
      </div>`).join('') || '<p class="muted">Zatiaľ žiadne karty.</p>'}</div>`;

  $('#addCardBtn').onclick = async () => {
    try {
      await api('/api/dash/giftcards', { method: 'POST', body: JSON.stringify({
        brand: $('#ncBrand').value, valueEur: Number($('#ncValue').value), description: $('#ncDesc').value
      }) });
      navigate('giftcards');
    } catch (err) { alert(err.message); }
  };

  $$('.add-codes-btn').forEach(btn => btn.onclick = async () => {
    const item = btn.closest('.card-item');
    const raw = $('.codes-input', item).value.trim();
    if (!raw) return;
    const codes = raw.split('\n').filter(Boolean).map(line => {
      const [code, redeemUrl] = line.split('|').map(s => s.trim());
      return { code, redeemUrl: redeemUrl || undefined };
    });
    try { await api(`/api/dash/giftcards/${btn.dataset.id}/codes`, { method: 'POST', body: JSON.stringify({ codes }) }); navigate('giftcards'); }
    catch (err) { alert(err.message); }
  });
}

// ─────────────────────────── PAYOUTS ───────────────────────────
async function renderPayouts() {
  const { payouts } = await api('/api/dash/payouts?status=pending');
  $('#main').innerHTML = `
    <div class="pagehead"><h2>Výplaty affil partnerov</h2><span class="muted">PAY by square — QR vygeneruje odkaz, prevod potvrdzuješ ty sám vo svojej bankovej appke</span></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Partner</th><th>Suma</th><th>IBAN</th><th>Žiadané</th><th></th></tr></thead>
        <tbody>${payouts.map(p => `<tr>
          <td>${p.partners ? p.partners.first_name+' '+p.partners.last_name : '—'}<br><span class="muted">${p.partners?.email||''}</span></td>
          <td>${p.amount}€</td><td class="muted">${p.iban || 'darčeková karta'}</td>
          <td class="muted">${new Date(p.requested_at).toLocaleDateString('sk-SK')}</td>
          <td>${p.iban ? `<button class="btn qr-btn" data-id="${p.id}">QR na výplatu</button>` : '<span class="muted">n/a</span>'}</td>
        </tr>`).join('') || '<tr><td class="muted" colspan="5">Žiadne čakajúce výbery.</td></tr>'}</tbody>
      </table>
    </div>`;
  $$('.qr-btn').forEach(btn => btn.onclick = () => openQrModal(btn.dataset.id));
}

async function openQrModal(payoutId) {
  const root = $('#qrModalRoot');
  root.innerHTML = `<div class="qr-modal-bg"><div class="qr-modal"><p class="muted">Generujem QR…</p></div></div>`;
  try {
    const data = await api(`/api/dash/payouts/${payoutId}/qr`);
    root.innerHTML = `<div class="qr-modal-bg">
      <div class="qr-modal">
        <h3 style="font-family:var(--serif);font-size:1.3rem;margin:0">${data.amount}€ → ${data.partnerName}</h3>
        <img src="${data.qrDataUrl}" alt="PAY by square QR">
        <p class="muted" style="word-break:break-all;font-family:var(--mono);font-size:.7rem">${data.iban}</p>
        <p class="muted">Naskenuj v bankovej appke a potvrď prevod. Až POTOM klikni nižšie.</p>
        <div style="display:flex;gap:.6rem;margin-top:.8rem">
          <button class="btn secondary" id="qrCloseBtn" style="flex:1">Zavrieť</button>
          <button class="btn" id="qrPaidBtn" style="flex:1">Označiť ako vyplatené</button>
        </div>
      </div>
    </div>`;
    $('#qrCloseBtn').onclick = () => { root.innerHTML = ''; };
    $('#qrPaidBtn').onclick = async () => {
      if (!confirm('Naozaj si prevod už potvrdil vo svojej bankovej appke?')) return;
      try { await api(`/api/dash/payouts/${payoutId}/mark-paid`, { method: 'POST', body: JSON.stringify({}) }); root.innerHTML = ''; navigate('payouts'); }
      catch (err) { alert(err.message); }
    };
  } catch (err) {
    root.innerHTML = `<div class="qr-modal-bg"><div class="qr-modal"><p style="color:var(--red)">${err.message}</p><button class="btn secondary" onclick="document.getElementById('qrModalRoot').innerHTML=''">Zavrieť</button></div></div>`;
  }
}

// ─────────────────────────── BUGS ───────────────────────────
async function renderBugs() {
  const { bugs } = await api('/api/dash/bugs');
  $('#main').innerHTML = `
    <div class="pagehead"><h2>Nahlásené chyby</h2></div>
    <div id="bugsList">${bugs.map(b => `
      <div class="bug-item" data-id="${b.id}">
        <div style="display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap">
          <span class="pill ${b.status}">${b.status}</span>
          <span class="muted">${b.source} · ${new Date(b.created_at).toLocaleString('sk-SK')}</span>
        </div>
        <p style="margin:.6rem 0">${(b.description||'').replace(/</g,'&lt;')}</p>
        <p class="muted">${b.page_url||''} ${b.reporter_email ? '· '+b.reporter_email : ''}</p>
        <select class="status-select">
          ${['open','in_progress','resolved','wont_fix'].map(s => `<option value="${s}" ${s===b.status?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>`).join('') || '<p class="muted">Žiadne nahlásené chyby.</p>'}</div>`;
  $$('.status-select').forEach(sel => sel.onchange = async () => {
    const id = sel.closest('.bug-item').dataset.id;
    try { await api(`/api/dash/bugs/${id}`, { method: 'PUT', body: JSON.stringify({ status: sel.value }) }); navigate('bugs'); }
    catch (err) { alert(err.message); }
  });
}

// ─────────────────────────── ADVISOR ───────────────────────────
async function renderAdvisor() {
  const { messages } = await api('/api/dash/advisor/history');
  $('#main').innerHTML = `
    <div class="pagehead"><h2>AI poradca</h2></div>
    <div class="chat">
      <div class="chat-msgs" id="chatMsgs">${messages.map(m => `<div class="msg ${m.role}">${(m.content||'').replace(/</g,'&lt;')}</div>`).join('')}</div>
      <div class="chat-input">
        <textarea id="chatInput" placeholder="Opýtaj sa na čísla, trendy, čo zlepšiť…"></textarea>
        <button class="btn" id="chatSendBtn">Poslať</button>
      </div>
    </div>`;
  const msgsEl = $('#chatMsgs');
  msgsEl.scrollTop = msgsEl.scrollHeight;
  $('#chatSendBtn').onclick = sendAdvisorMsg;
  $('#chatInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAdvisorMsg(); } });
}

async function sendAdvisorMsg() {
  const input = $('#chatInput');
  const message = input.value.trim();
  if (!message) return;
  input.value = '';
  const msgsEl = $('#chatMsgs');
  msgsEl.insertAdjacentHTML('beforeend', `<div class="msg user">${message.replace(/</g,'&lt;')}</div>`);
  msgsEl.insertAdjacentHTML('beforeend', `<div class="msg assistant" id="pendingReply">…</div>`);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  try {
    if (!currentOverviewSnapshot) currentOverviewSnapshot = await api('/api/dash/overview');
    const { reply } = await api('/api/dash/advisor/chat', { method: 'POST', body: JSON.stringify({ message, overviewSnapshot: currentOverviewSnapshot }) });
    $('#pendingReply').textContent = reply;
    $('#pendingReply').removeAttribute('id');
  } catch (err) {
    $('#pendingReply').textContent = 'Chyba: ' + err.message;
  }
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

// ─────────────────────────── AI OPS ───────────────────────────
async function renderAiops() {
  const { actions } = await api('/api/dash/aiops/log');
  $('#main').innerHTML = `
    <div class="pagehead"><h2>AI ops log</h2><button class="btn" id="runAiopsBtn">Spustiť teraz</button></div>
    <p class="muted" style="margin-bottom:1.2rem">AI tu autonómne rozhoduje naprieč appkami (blog, príprava výplat) — každá akcia sa loguje nižšie s dôvodom. Platby AI nikdy sama nevykonáva.</p>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Čas</th><th>Akcia</th><th>Systém</th><th>Cieľ</th><th>Dôvod</th><th>Výsledok</th></tr></thead>
        <tbody>${actions.map(a => `<tr>
          <td class="muted">${new Date(a.created_at).toLocaleString('sk-SK')}</td>
          <td>${a.action_type}</td><td>${a.target_system||''}</td><td class="muted">${a.target_id||''}</td>
          <td class="muted">${a.reasoning||''}</td>
          <td><span class="pill ${a.result==='success'?'resolved':'open'}">${a.result}</span></td>
        </tr>`).join('') || '<tr><td class="muted" colspan="6">Zatiaľ žiadne akcie.</td></tr>'}</tbody>
      </table>
    </div>`;
  $('#runAiopsBtn').onclick = async () => {
    $('#runAiopsBtn').disabled = true; $('#runAiopsBtn').textContent = 'Beží…';
    try { await api('/api/dash/aiops/run', { method: 'POST', body: JSON.stringify({}) }); navigate('aiops'); }
    catch (err) { alert(err.message); $('#runAiopsBtn').disabled = false; $('#runAiopsBtn').textContent = 'Spustiť teraz'; }
  };
}

checkAuth();
